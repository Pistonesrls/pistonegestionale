<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dashboard Ordini Grafica</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #ffffff; --bg-soft: #f9fafb; --bg-muted: #f3f4f6;
  --border: #e5e7eb; --border-strong: #d1d5db;
  --text: #111827; --text-muted: #6b7280; --text-faint: #9ca3af;
  --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff6ff;
  --success: #059669; --danger: #dc2626; --warning: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; font-size: 14px; line-height: 1.5; transition: background 0.3s; }
body.stale { background: #fef2f2; }
body.stale .stale-banner { display: block; }
.container { max-width: 860px; margin: 0 auto; }
.stale-banner { display: none; background: var(--danger); color: white; padding: 12px; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 14px; font-size: 13px; }
.stale-banner small { display: block; font-weight: 400; opacity: 0.9; margin-top: 2px; }
.header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.last-update { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
.header-actions { display: flex; gap: 6px; }
.icon-btn { width: 36px; height: 36px; padding: 0; background: white; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: var(--text); font-size: 16px; }
.icon-btn.danger { color: var(--danger); }
button { font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 8px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: white; }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost { background: white; color: var(--text); border: 1px solid var(--border); }
.btn-soft { background: var(--bg-muted); color: var(--text); }
.file-zone { border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--bg-soft); }
.file-zone h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
label.dropzone { display: block; border: 2px dashed var(--border-strong); background: white; border-radius: 10px; padding: 24px 14px; text-align: center; cursor: pointer; transition: all 0.15s; }
label.dropzone:hover, label.dropzone.dragover { border-color: var(--accent); background: var(--accent-soft); }
label.dropzone i { font-size: 28px; color: var(--text-faint); display: block; margin-bottom: 6px; }
label.dropzone .label { font-weight: 600; font-size: 13px; }
label.dropzone .sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
input[type="file"] { display: none; }
.manual-form { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-soft); margin-bottom: 12px; overflow: hidden; }
.manual-toggle { width: 100%; background: transparent; border: none; padding: 12px 14px; text-align: left; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; color: var(--text); }
.manual-body { display: none; padding: 0 14px 14px; }
.manual-body.active { display: block; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.form-field { display: flex; flex-direction: column; gap: 3px; }
.form-field label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.form-field input, .form-field select, .form-field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 13px; background: white; }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-color: var(--accent); }
.form-field.full { grid-column: span 2; }
.loading { display: none; border: 1px solid #bfdbfe; background: var(--accent-soft); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
.loading.active { display: block; }
.loading-title { font-weight: 700; color: var(--accent); font-size: 13px; margin-bottom: 4px; }
.loading-status { font-size: 12px; color: var(--accent-hover); margin-bottom: 8px; min-height: 16px; }
.progress { height: 6px; background: #dbeafe; border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.2s; width: 0%; }
.preview { display: none; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-soft); padding: 14px; margin-bottom: 12px; }
.preview.active { display: block; }
.preview h3 { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.preview-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
.stat-mini { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
.stat-mini .num { font-size: 20px; font-weight: 800; display: block; }
.stat-mini .num-ok { color: var(--success); }
.stat-mini .num-skip { color: var(--text-faint); }
.stat-mini .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
.reasons { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 8px; max-height: 140px; overflow: auto; font-size: 12px; margin-bottom: 10px; }
.reason { display: flex; justify-content: space-between; padding: 3px 4px; border-bottom: 1px solid var(--bg-muted); }
.reason:last-child { border-bottom: none; }
.reason-count { font-weight: 600; color: var(--text-muted); }
.preview-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
.search-wrap input { width: 100%; padding: 10px 12px 10px 34px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 13px; background: white; }
.search-wrap input:focus { outline: none; border-color: var(--accent); }
.stats-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
@media (max-width: 640px) { .stats-row { grid-template-columns: repeat(3, 1fr); } }
.stat-card { background: var(--bg-soft); border: 1px solid var(--border); border-radius: 10px; padding: 10px 6px; text-align: center; }
.stat-card .n { font-size: 18px; font-weight: 800; display: block; }
.stat-card .l { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 2px; }
.card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; transition: all 0.15s; }
.card.no-evade { border-left: 3px solid var(--warning); }
.card.overdue { border-left: 3px solid var(--danger); background: #fff5f5; }
.card.manual { border-left: 3px solid var(--accent); background: var(--accent-soft); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.card-title { flex: 1; min-width: 0; }
.order-num { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.order-date { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.cliente { font-size: 15px; font-weight: 700; margin-top: 4px; color: var(--text); }
.desc { font-size: 12px; color: var(--text-muted); font-style: italic; margin-top: 2px; }
.desc.placeholder { opacity: 0.5; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.badge-alberto { background: #f3e8ff; color: #7c3aed; }
.badge-pietro { background: #e0f2fe; color: #0891b2; }
.badge-samuele { background: #d1fae5; color: #059669; }
.badge-salvo { background: var(--bg-muted); color: #475569; }
.badge-smistare { background: #fef3c7; color: #b45309; }
.badge-manual { background: var(--accent-soft); color: var(--accent); }
.tag { display: inline-block; padding: 2px 7px; background: var(--bg-muted); border-radius: 4px; font-size: 10px; color: #4b5563; font-weight: 600; }
.tag.highlight { background: #fef3c7; color: var(--warning); }
.fields { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--bg-muted); display: grid; gap: 6px; }
.field { display: grid; grid-template-columns: 100px 1fr; gap: 8px; align-items: start; }
.field label { font-size: 11px; color: var(--text-muted); font-weight: 500; padding-top: 7px; }
.field input, .field textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; font-size: 12px; background: white; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 32px; }
.card-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 8px; }
.save-btn { background: var(--accent); color: white; padding: 7px 12px; font-size: 12px; }
.delete-btn { background: white; color: var(--danger); border: 1px solid var(--border); padding: 7px 10px; font-size: 12px; }
.debug-panel { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 10px; max-height: 240px; overflow: auto; margin: 10px 0; display: none; }
.debug-panel.active { display: block; }
.debug-panel .info { color: #93c5fd; }
.debug-panel .success { color: #86efac; }
.debug-panel .warning { color: #fde047; }
.debug-panel .error { color: #fca5a5; }
.debug-panel .step { color: #c4b5fd; font-weight: 700; }
.empty { text-align: center; padding: 36px 16px; color: var(--text-muted); }
.empty i { font-size: 36px; display: block; margin-bottom: 8px; opacity: 0.4; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 1000; padding: 20px; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
.modal-bg.active { display: flex; }
.modal { background: white; border-radius: 14px; padding: 20px; width: 100%; max-width: 420px; }
.modal h3 { font-size: 15px; margin-bottom: 8px; }
.modal-body { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 14px; }
.modal-actions { display: grid; gap: 6px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: white; padding: 10px 14px; border-radius: 10px; font-size: 12px; z-index: 2000; display: flex; align-items: center; gap: 6px; max-width: 90vw; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="container">
  <div class="stale-banner">
    <i class="bi bi-exclamation-triangle-fill"></i> ATTENZIONE: DATI NON AGGIORNATI
    <small>Ultimo caricamento oltre 24h fa</small>
  </div>

  <div class="header">
    <div>
      <h1><i class="bi bi-list-check"></i> Ordini Grafica</h1>
      <div class="last-update" id="lastUpdate">Caricamento...</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Aggiorna"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="icon-btn danger" id="clearBtn" title="Svuota database"><i class="bi bi-trash"></i></button>
    </div>
  </div>

  <button class="btn-soft" id="debugToggle" style="margin-bottom: 10px; font-size: 11px; padding: 6px 10px;">
    <i class="bi bi-terminal"></i> Mostra log
  </button>
  <div class="debug-panel active" id="debugPanel"></div>

  <div class="loading" id="loadingBox">
    <div class="loading-title" id="loadingTitle">Elaborazione...</div>
    <div class="loading-status" id="loadingStatus"></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="file-zone">
    <h3><i class="bi bi-file-earmark-spreadsheet"></i> Import da CSV Danea</h3>
    <label for="csvFile" class="dropzone" id="dropzone">
      <i class="bi bi-cloud-arrow-up"></i>
      <div class="label">Clicca qui per caricare il CSV</div>
      <div class="sub">oppure trascina il file</div>
    </label>
    <input type="file" id="csvFile" accept=".csv,.txt,text/csv">
  </div>

  <div class="manual-form">
    <button class="manual-toggle" id="manualToggle">
      <span><i class="bi bi-plus-circle"></i> Aggiungi ordine manualmente</span>
      <i class="bi bi-chevron-down" id="manualToggleIcon"></i>
    </button>
    <div class="manual-body" id="manualBody">
      <div class="form-grid">
        <div class="form-field">
          <label>Numero ordine</label>
          <input type="text" id="mNumero" placeholder="Es. 9999">
        </div>
        <div class="form-field">
          <label>Data ordine</label>
          <input type="date" id="mData">
        </div>
        <div class="form-field full">
          <label>Cliente</label>
          <input type="text" id="mCliente" placeholder="Nome cliente">
        </div>
        <div class="form-field">
          <label>Grafico assegnato</label>
          <select id="mGrafico">
            <option value="">Da smistare</option>
            <option value="ALBERTO">Alberto</option>
            <option value="PIETRO">Pietro</option>
            <option value="SAMUELE">Samuele</option>
            <option value="COMPLETATO">Salvo G.</option>
          </select>
        </div>
        <div class="form-field">
          <label>Settore</label>
          <select id="mSettore">
            <option value="PLOTTER">Plotter</option>
            <option value="INSEGNE">Insegne</option>
            <option value="FURGONE">Furgone</option>
            <option value="DIGITALE">Digitale</option>
            <option value="STAMPA UV">Stampa UV</option>
            <option value="DTF">DTF</option>
            <option value="RICAMO">Ricamo</option>
            <option value="SERIGRAFIA">Serigrafia</option>
          </select>
        </div>
        <div class="form-field full">
          <label>Descrizione breve</label>
          <input type="text" id="mDescrizione" placeholder="Breve descrizione visibile">
        </div>
        <div class="form-field full">
          <label>Note interne</label>
          <textarea id="mNote" placeholder="Note interne (opzionale)"></textarea>
        </div>
      </div>
      <button class="btn-primary" id="manualSave" style="width:100%;">
        <i class="bi bi-plus-lg"></i> Aggiungi ordine
      </button>
    </div>
  </div>

  <div class="preview" id="preview">
    <h3><i class="bi bi-clipboard-data"></i> Anteprima filtraggio CSV</h3>
    <div class="preview-stats" id="previewStats"></div>
    <div class="reasons" id="previewReasons"></div>
    <div class="preview-actions">
      <button class="btn-ghost" id="cancelImportBtn"><i class="bi bi-x-lg"></i> Annulla</button>
      <button class="btn-success" id="importBtn"><i class="bi bi-cloud-arrow-up"></i> Importa nel database</button>
    </div>
  </div>

  <div class="search-wrap">
    <i class="bi bi-search"></i>
    <input type="text" id="searchInput" placeholder="Cerca cliente, numero, note, descrizione...">
  </div>

  <div class="stats-row" id="statsRow"></div>
  <div id="ordersList"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalButtons"></div>
  </div>
</div>

<script>
"use strict";

const SUPABASE_URL = "https://emaiswhuznyqkzzzelvh.supabase.co";
const SUPABASE_KEY = "sb_publishable_7xF7dZXBDOahRmdanK-cFw_jx0sO0Cw";

let supabase = null;
let allOrders = [];
let pendingImport = null;
let customMap = {};

const currentYear = new Date().getFullYear();
const prevYearOct1 = new Date(currentYear - 1, 9, 1);

const $ = id => document.getElementById(id);

function log(msg, type = "info") {
  const p = $("debugPanel");
  const t = new Date().toLocaleTimeString("it-IT", { hour12: false });
  const row = document.createElement("div");
  row.className = type;
  row.textContent = `[${t}] ${msg}`;
  p.appendChild(row);
  p.scrollTop = p.scrollHeight;
  console.log(`[${type}] ${msg}`);
}

function toast(msg, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type === "error" ? "bi-x-circle-fill" : "bi-check-circle-fill";
  el.innerHTML = `<i class="bi ${icon}"></i> ${escapeHtml(msg)}`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 2500);
}

function showLoading(title, status = "", pct = 0) {
  $("loadingBox").classList.add("active");
  $("loadingTitle").textContent = title;
  $("loadingStatus").textContent = status;
  $("progressFill").style.width = pct + "%";
}
function updateLoading(status, pct) {
  $("loadingStatus").textContent = status;
  $("progressFill").style.width = pct + "%";
}
function hideLoading() { $("loadingBox").classList.remove("active"); }

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toDatetimeLocalValue(v) {
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function initSupabase() {
  try {
    if (!window.supabase) throw new Error("Libreria Supabase non caricata");
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    log("✓ Supabase connesso", "success");
  } catch (e) {
    log("❌ Errore Supabase: " + e.message, "error");
  }
}

// ============ DATE PARSER ============
function parseItalianDate(s) {
  if (!s) return null;
  s = String(s).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (!m) return null;
  const d = +m[1], mo = +m[2];
  let y = +m[3];
  if (y < 100) y += 2000;
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const date = new Date(y, mo - 1, d);
  if (date.getFullYear() !== y || date.getMonth() !== mo - 1 || date.getDate() !== d) return null;
  return date;
}

function isItalianDate(s) { return parseItalianDate(s) !== null; }

// ============ CSV PARSER ============
function parseCsvLine(line) {
  const fields = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      if (inQuotes && line[i+1] === '"') { field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      fields.push(field);
      field = "";
    } else if (c !== '\r') {
      field += c;
    }
  }
  fields.push(field);
  return fields;
}

// ============ FILTRI ============
function isOnlyDigits(s) { return /^\d+$/.test(String(s).trim()); }

function hasValidSector(settore) {
  if (!settore) return false;
  const s = settore.toUpperCase();
  return s.includes("PLOTTER") || s.includes("INSEGNE") || s.includes("FURGONE");
}

function isStatoValidoGlobale(stato) {
  if (!stato) return false;
  const s = stato.toLowerCase();
  if (s.includes("concluso")) return false;
  if (s.includes("annullato")) return false;
  if (s.includes("sospeso")) return false;
  if (s.includes("confermato") || s.includes("confermare")) return true;
  return false;
}

function isSoloConfermato(stato) {
  if (!stato) return false;
  const s = stato.toLowerCase();
  if (s.includes("concluso")) return false;
  if (s.includes("annullato")) return false;
  if (s.includes("sospeso")) return false;
  if (s.includes("confermare")) return false;
  return s.includes("confermato");
}

function isConfermatoODaConfermare(stato) {
  if (!stato) return false;
  const s = stato.toLowerCase();
  if (s.includes("concluso")) return false;
  if (s.includes("annullato")) return false;
  if (s.includes("sospeso")) return false;
  return s.includes("confermato") || s.includes("confermare");
}

// ============ LOGICA SITUAZIONI ============
// MAPPATURA CORRETTA COLONNE:
// [0] vuoto [1] data [2] operatore commerciale [3] numero [4] stato 
// [5] GRAFICO [6] data evasione [7] cliente [8] note [9] prezzo [10+] settori/vari

function findSettore(fields, startIdx) {
  // Cerca il settore tra i campi dal index startIdx in poi
  const settoriTarget = ["PLOTTER", "INSEGNE", "FURGONE", "DIGITALE", "DTF", "RICAMO", "SERIGRAFIA", "STAMPA UV", "STAMPA DIRETTA", "SUBLIMAZIONE", "POLIFLEX", "LITOGRAFIA", "TIMBRI"];
  for (let i = startIdx; i < fields.length; i++) {
    const f = (fields[i] || "").toUpperCase();
    for (const s of settoriTarget) {
      if (f.includes(s)) return fields[i];
    }
  }
  return "";
}

function classifyOrder(fields) {
  if (fields.length < 10) return { valid: false, reason: "Riga troppo corta" };

  // Trova la prima data italiana valida tra i primi 3 campi
  let dataIdx = -1;
  for (let i = 0; i < Math.min(3, fields.length); i++) {
    if (isItalianDate(fields[i])) { dataIdx = i; break; }
  }
  if (dataIdx < 0) return { valid: false, reason: "Data non trovata" };

  const offset = dataIdx;
  // MAPPATURA CORRETTA
  const dataStr = fields[offset] || "";
  const operatoreComm = (fields[offset + 1] || "").trim(); // operatore commerciale (SALVO G, ENRICA, etc)
  const numero = (fields[offset + 2] || "").trim();
  const stato = (fields[offset + 3] || "").trim();
  const grafico = (fields[offset + 4] || "").trim(); // <-- QUESTO è il campo grafico vero
  const dataEvasione = (fields[offset + 5] || "").trim();
  const cliente = (fields[offset + 6] || "").trim();
  const note = (fields[offset + 7] || "").trim();
  const prezzo = (fields[offset + 8] || "").trim();
  
  // Il settore è nei campi successivi (possono essere multipli)
  const settore = findSettore(fields, offset + 9);

  const data = parseItalianDate(dataStr);
  if (!data) return { valid: false, reason: "Data non valida" };

  const graficoUp = grafico.toUpperCase().replace(/\s+/g, " ").trim();
  const numeroUp = numero.toUpperCase();
  const year = data.getFullYear();

  // === REGOLE GLOBALI DI ESCLUSIONE ===
  if (!isStatoValidoGlobale(stato)) {
    return { valid: false, reason: `Stato escluso: ${stato || "n/d"}` };
  }
  if (numeroUp.includes("/B")) {
    return { valid: false, reason: "Numero /B" };
  }

  // === CONTROLLO SETTORE ===
  if (!hasValidSector(settore)) {
    return { valid: false, reason: `Settore non valido: ${settore || "n/d"}` };
  }

  // === SITUAZIONE 1: grafico vuoto ===
  if (!graficoUp) {
    if (isOnlyDigits(numero) && isSoloConfermato(stato)) {
      return buildValid({ numero, year, cliente, data_ordine: data, grafico, stato, settore, note, situation: 1 });
    }
    return { valid: false, reason: "Situazione 1 non soddisfatta" };
  }

  // === SITUAZIONE 2: grafici attivi ===
  if (graficoUp === "ALBERTO" || graficoUp === "PIETRO" || graficoUp === "SAMUELE") {
    return buildValid({ numero, year, cliente, data_ordine: data, grafico, stato, settore, note, situation: 2 });
  }

  // === SITUAZIONE 3: grafici completati ===
  if (graficoUp === "ALBERTO - COMPLETATO" ||
      graficoUp === "PIETRO - COMPLETATO" ||
      graficoUp === "SAMUELE - COMPLETATO" ||
      graficoUp === "COMPLETATO") {
    if (!isOnlyDigits(numero)) {
      return { valid: false, reason: "Situazione 3: numero non cifre" };
    }
    if (!isConfermatoODaConfermare(stato)) {
      return { valid: false, reason: `Situazione 3: stato non valido (${stato})` };
    }
    if (year === currentYear) {
      return buildValid({ numero, year, cliente, data_ordine: data, grafico, stato, settore, note, situation: 3 });
    }
    if (year === currentYear - 1 && data >= prevYearOct1) {
      return buildValid({ numero, year, cliente, data_ordine: data, grafico, stato, settore, note, situation: 3 });
    }
    return { valid: false, reason: `Situazione 3: anno ${year} fuori range` };
  }

  return { valid: false, reason: `Grafico escluso: ${grafico}` };
}

function buildValid({ numero, year, cliente, data_ordine, grafico, stato, settore, note, situation }) {
  return {
    valid: true,
    situation,
    data: {
      numero_ordine: numero,
      anno_ordine: year,
      cliente: cliente || "Cliente",
      data_ordine: `${year}-${String(data_ordine.getMonth()+1).padStart(2,"0")}-${String(data_ordine.getDate()).padStart(2,"0")}`,
      grafico: grafico,
      stato: stato,
      settore: settore,
      descrizione_breve: note || "" // Le note del CSV diventano descrizione breve
    }
  };
}

// ============ PROCESS CSV ============
function processCSV(text) {
  log("═══ PROCESSAMENTO CSV ═══", "step");
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  log(`Righe totali: ${lines.length}`, "info");

  const valid = [];
  const reasons = {};
  let skipped = 0;

  lines.forEach((line, idx) => {
    const fields = parseCsvLine(line);
    const result = classifyOrder(fields);
    if (result.valid) {
      valid.push(result.data);
      if (valid.length <= 5) {
        log(`✓ Ordine ${result.data.numero_ordine} (${result.data.cliente}) - Sit. ${result.situation} - Settore: ${result.data.settore}`, "success");
      }
    } else {
      skipped++;
      reasons[result.reason] = (reasons[result.reason] || 0) + 1;
    }
  });

  const map = new Map();
  valid.forEach(o => {
    const key = `${o.numero_ordine}_${o.anno_ordine}`;
    if (!map.has(key) || o.anno_ordine === currentYear) map.set(key, o);
  });

  log(`Ordini validi: ${map.size}`, "success");
  log(`Scartati: ${skipped}`, skipped ? "warning" : "info");

  return {
    total: lines.length,
    valid: Array.from(map.values()),
    validCount: map.size,
    skipCount: skipped,
    reasons
  };
}

// ============ FILE HANDLING ============
async function handleFile(file) {
  log(`File: ${file.name} (${file.size} byte)`, "step");
  if (!file.name.toLowerCase().endsWith(".csv")) {
    toast("Seleziona un file CSV", "error");
    return;
  }

  showLoading("Lettura file...", "", 10);
  try {
    const buffer = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error("Lettura fallita"));
      r.readAsArrayBuffer(file);
    });

    let text;
    try { text = new TextDecoder("utf-8").decode(buffer); }
    catch { text = new TextDecoder().decode(buffer); }
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    updateLoading("Analisi CSV...", 40);
    await new Promise(r => setTimeout(r, 20));

    const result = processCSV(text);
    pendingImport = result;

    showPreview(result);
    hideLoading();

    if (result.validCount === 0) {
      toast("Nessun ordine valido trovato", "error");
    } else {
      toast(`${result.validCount} ordini validi trovati`);
    }
  } catch (err) {
    hideLoading();
    log("❌ Errore: " + err.message, "error");
    toast("Errore lettura file", "error");
  }
}

function showPreview(r) {
  $("preview").classList.add("active");
  $("previewStats").innerHTML = `
    <div class="stat-mini"><span class="num">${r.total}</span><span class="lbl">Letti</span></div>
    <div class="stat-mini"><span class="num num-ok">${r.validCount}</span><span class="lbl">Validi</span></div>
    <div class="stat-mini"><span class="num num-skip">${r.skipCount}</span><span class="lbl">Scartati</span></div>`;

  const reasons = Object.entries(r.reasons).sort((a,b) => b[1]-a[1]);
  $("previewReasons").innerHTML = reasons.length === 0
    ? '<div class="reason"><span>Nessuno scarto 🎉</span></div>'
    : reasons.map(([k,v]) => `<div class="reason"><span>${escapeHtml(k)}</span><span class="reason-count">${v}</span></div>`).join("");

  $("importBtn").disabled = r.validCount === 0;
}

function cancelPreview() {
  pendingImport = null;
  $("preview").classList.remove("active");
  $("csvFile").value = "";
}

// ============ IMPORT ============
async function doImport() {
  if (!pendingImport || pendingImport.validCount === 0) return;
  if (!supabase) { toast("Supabase non disponibile", "error"); return; }

  showLoading("Verifica dati esistenti...", "", 10);
  log("Verifica dati esistenti...", "step");

  try {
    const { data, error } = await supabase
      .from("ordini")
      .select("numero_ordine, anno_ordine, note_interne, descrizione_breve, data_evasione_grafica");
    
    if (error) {
      log("❌ Errore query: " + error.message + " (code: " + error.code + ")", "error");
      throw error;
    }

    customMap = {};
    (data || []).forEach(row => {
      const hasCustom =
        (row.note_interne && row.note_interne.trim()) ||
        (row.descrizione_breve && row.descrizione_breve.trim()) ||
        row.data_evasione_grafica;
      if (hasCustom) {
        customMap[`${row.numero_ordine}_${row.anno_ordine}`] = {
          note_interne: row.note_interne || "",
          descrizione_breve: row.descrizione_breve || "",
          data_evasione_grafica: row.data_evasione_grafica
        };
      }
    });

    const hasAnyCustom = Object.keys(customMap).length > 0;
    log(`Ordini con dati salvati: ${Object.keys(customMap).length}`, "info");
    hideLoading();

    if (hasAnyCustom) {
      showModal(
        '<i class="bi bi-exclamation-triangle"></i> Dati salvati trovati',
        `Ci sono <strong>${Object.keys(customMap).length}</strong> ordini con note, descrizioni o date evasione salvate.<br><br>Come vuoi procedere?`,
        [
          { label: '<i class="bi bi-shield-check"></i> Mantieni i dati salvati', className: "btn-primary", onClick: () => runImport(true) },
          { label: '<i class="bi bi-arrow-repeat"></i> Sovrascrivi tutto', className: "btn-danger", onClick: () => runImport(false) },
          { label: "Annulla", className: "btn-ghost", onClick: () => {} }
        ]
      );
    } else {
      await runImport(false);
    }
  } catch (err) {
    hideLoading();
    log("❌ Errore: " + err.message, "error");
    toast("Errore: " + err.message, "error");
  }
}

async function runImport(keepCustom) {
  try {
    showLoading("Importazione", "Cancellazione ordini dal CSV...", 10);
    log(`Import ${pendingImport.valid.length} ordini (keep=${keepCustom})`, "step");

    // Cancella solo ordini NON manuali
    const { error: delErr } = await supabase
      .from("ordini")
      .delete()
      .eq("inserito_manuale", false);
    if (delErr) {
      log("❌ Errore delete: " + delErr.message, "error");
      throw delErr;
    }
    log("Ordini CSV precedenti cancellati", "success");

    const rows = pendingImport.valid.map(o => ({ ...o, inserito_manuale: false }));
    const BATCH = 50;
    let inserted = 0;
    let failed = 0;

    for (let i = 0; i < rows.length; i += BATCH) {
      const batch = rows.slice(i, i + BATCH);
      const { data, error } = await supabase.from("ordini").insert(batch).select();
      
      if (error) {
        log(`❌ Batch ${Math.floor(i/BATCH)+1} errore: ${error.message} (code: ${error.code})`, "error");
        // Prova uno per uno per capire quali falliscono
        for (const row of batch) {
          const { error: singleErr } = await supabase.from("ordini").insert(row);
          if (singleErr) {
            log(`  ✗ ${row.numero_ordine}: ${singleErr.message}`, "error");
            failed++;
          } else {
            inserted++;
          }
        }
      } else {
        inserted += (data || []).length;
        log(`✓ Batch ${Math.floor(i/BATCH)+1}: ${(data || []).length} ordini`, "success");
      }
      
      updateLoading(`Inserimento ${inserted}/${rows.length}...`, 10 + (i/rows.length)*60);
      await new Promise(r => setTimeout(r, 5));
    }
    log(`Inseriti: ${inserted}, Falliti: ${failed}`, failed ? "warning" : "success");

    if (keepCustom && Object.keys(customMap).length > 0) {
      updateLoading("Ripristino dati salvati...", 80);
      const { data: newRows } = await supabase.from("ordini").select("id, numero_ordine, anno_ordine");
      let restored = 0;
      for (const row of (newRows || [])) {
        const saved = customMap[`${row.numero_ordine}_${row.anno_ordine}`];
        if (saved) {
          await supabase.from("ordini").update(saved).eq("id", row.id);
          restored++;
        }
      }
      log(`Ripristinati: ${restored}`, "success");
    }

    await supabase.from("meta").upsert({ id: 1, ultima_importazione: new Date().toISOString() });

    hideLoading();
    cancelPreview();
    toast(`✓ Importati ${inserted} ordini` + (failed ? ` (${failed} falliti)` : ""));
    await loadOrders();
  } catch (err) {
    hideLoading();
    log("❌ Errore import: " + err.message, "error");
    toast("Errore import: " + err.message, "error");
  }
}

// ============ MANUAL INSERT ============
async function saveManualOrder() {
  const numero = $("mNumero").value.trim();
  const data = $("mData").value;
  const cliente = $("mCliente").value.trim();
  const grafico = $("mGrafico").value;
  const settore = $("mSettore").value;
  const descrizione = $("mDescrizione").value.trim();
  const note = $("mNote").value.trim();

  if (!numero || !data || !cliente) {
    toast("Compila numero, data e cliente", "error");
    return;
  }

  try {
    const year = new Date(data).getFullYear();
    const record = {
      numero_ordine: numero,
      anno_ordine: year,
      cliente,
      data_ordine: data,
      grafico,
      stato: "Confermato",
      settore,
      descrizione_breve: descrizione,
      note_interne: note,
      inserito_manuale: true
    };

    const { error } = await supabase.from("ordini").insert(record);
    if (error) {
      if (error.code === "23505") {
        toast("Ordine già esistente", "error");
        return;
      }
      throw error;
    }

    toast("✓ Ordine aggiunto");
    $("mNumero").value = "";
    $("mCliente").value = "";
    $("mDescrizione").value = "";
    $("mNote").value = "";
    await loadOrders();
  } catch (err) {
    log("❌ Errore: " + err.message, "error");
    toast("Errore: " + err.message, "error");
  }
}

// ============ LOAD ============
async function loadOrders() {
  if (!supabase) {
    $("ordersList").innerHTML = '<div class="empty"><i class="bi bi-wifi-off"></i>Supabase non disponibile</div>';
    return;
  }

  log("Caricamento ordini...", "step");
  $("ordersList").innerHTML = '<div class="empty"><i class="bi bi-hourglass-split"></i>Caricamento...</div>';

  try {
    const { data, error } = await supabase.from("ordini").select("*");
    if (error) throw error;
    allOrders = data || [];
    log(`Caricati ${allOrders.length} ordini`, "success");
    renderOrders();
    await loadMeta();
  } catch (err) {
    log("❌ Errore: " + err.message, "error");
    $("ordersList").innerHTML = `<div class="empty"><i class="bi bi-exclamation-triangle"></i>Errore DB: ${escapeHtml(err.message)}<br><br><small>Verifica che le tabelle esistano su Supabase</small></div>`;
  }
}

async function loadMeta() {
  try {
    const { data } = await supabase.from("meta").select("ultima_importazione").eq("id", 1).maybeSingle();
    const el = $("lastUpdate");
    if (data && data.ultima_importazione) {
      const d = new Date(data.ultima_importazione);
      const hours = (Date.now() - d.getTime()) / 3600000;
      el.innerHTML = `<i class="bi bi-clock"></i> Aggiornato: ${d.toLocaleString("it-IT")}`;
      document.body.classList.toggle("stale", hours > 24);
    } else {
      el.innerHTML = '<i class="bi bi-clock"></i> Nessun aggiornamento';
    }
  } catch (e) { log("Errore meta: " + e.message, "warning"); }
}

// ============ RENDER ============
function getGraficoInfo(g) {
  const n = (g || "").toUpperCase().replace(/\s+/g, " ").trim();
  if (!n) return { label: "Da smistare", cls: "badge-smistare", icon: "bi-person-plus" };
  if (n === "COMPLETATO") return { label: "Salvo G.", cls: "badge-salvo", icon: "bi-person-check" };
  if (n.includes("ALBERTO")) return { label: "Alberto", cls: "badge-alberto", icon: "bi-person" };
  if (n.includes("PIETRO")) return { label: "Pietro", cls: "badge-pietro", icon: "bi-person" };
  if (n.includes("SAMUELE")) return { label: "Samuele", cls: "badge-samuele", icon: "bi-person" };
  return { label: n, cls: "badge-salvo", icon: "bi-person" };
}

function renderOrders() {
  const q = $("searchInput").value.toLowerCase().trim();
  let visible = allOrders.slice();

  if (q) {
    visible = visible.filter(o =>
      (o.cliente || "").toLowerCase().includes(q) ||
      (o.numero_ordine || "").toLowerCase().includes(q) ||
      (o.descrizione_breve || "").toLowerCase().includes(q) ||
      (o.note_interne || "").toLowerCase().includes(q) ||
      (o.settore || "").toLowerCase().includes(q)
    );
  }

  visible.sort((a, b) => {
    const aE = a.data_evasione_grafica ? new Date(a.data_evasione_grafica).getTime() : Infinity;
    const bE = b.data_evasione_grafica ? new Date(b.data_evasione_grafica).getTime() : Infinity;
    if (aE !== bE) return aE - bE;
    return new Date(b.data_ordine || 0) - new Date(a.data_ordine || 0);
  });

  const stats = { tot: visible.length, smistare: 0, alberto: 0, pietro: 0, samuele: 0, salvo: 0 };
  visible.forEach(o => {
    const g = (o.grafico || "").toUpperCase().replace(/\s+/g, " ").trim();
    if (!g) stats.smistare++;
    else if (g.includes("ALBERTO")) stats.alberto++;
    else if (g.includes("PIETRO")) stats.pietro++;
    else if (g.includes("SAMUELE")) stats.samuele++;
    else if (g === "COMPLETATO") stats.salvo++;
  });

  $("statsRow").innerHTML = `
    <div class="stat-card"><span class="n">${stats.tot}</span><span class="l">Totale</span></div>
    <div class="stat-card"><span class="n" style="color:var(--warning)">${stats.smistare}</span><span class="l">Smistare</span></div>
    <div class="stat-card"><span class="n" style="color:#7c3aed">${stats.alberto}</span><span class="l">Alberto</span></div>
    <div class="stat-card"><span class="n" style="color:#0891b2">${stats.pietro}</span><span class="l">Pietro</span></div>
    <div class="stat-card"><span class="n" style="color:#059669">${stats.samuele}</span><span class="l">Samuele</span></div>
    <div class="stat-card"><span class="n" style="color:#475569">${stats.salvo}</span><span class="l">Salvo G.</span></div>
  `;

  if (visible.length === 0) {
    $("ordersList").innerHTML = `<div class="empty"><i class="bi bi-inbox"></i>${q ? "Nessun risultato" : "Nessun ordine"}<br><small>${q ? "" : "Carica un CSV o aggiungi manualmente"}</small></div>`;
    return;
  }

  $("ordersList").innerHTML = visible.map(o => {
    const g = getGraficoInfo(o.grafico);
    const hasEv = !!o.data_evasione_grafica;
    const isOverdue = hasEv && new Date(o.data_evasione_grafica) < new Date();
    let cls = "";
    if (o.inserito_manuale) cls = "manual";
    else if (!hasEv) cls = "no-evade";
    else if (isOverdue) cls = "overdue";

    const settoreHighlight = ["PLOTTER", "INSEGNE", "FURGONE"].some(s => (o.settore || "").toUpperCase().includes(s));
    const evVal = toDatetimeLocalValue(o.data_evasione_grafica);
    const dOrd = o.data_ordine ? new Date(o.data_ordine).toLocaleDateString("it-IT") : "";

    return `
      <div class="card ${cls}">
        <div class="card-top">
          <div class="card-title">
            <div class="order-num">
              <i class="bi bi-hash"></i>${escapeHtml(o.numero_ordine)}
              ${o.inserito_manuale ? '<span class="badge badge-manual"><i class="bi bi-hand-index"></i>Manuale</span>' : ""}
              ${o.settore ? `<span class="tag${settoreHighlight ? " highlight" : ""}">${escapeHtml(o.settore)}</span>` : ""}
            </div>
            <div class="order-date"><i class="bi bi-calendar3"></i> ${escapeHtml(dOrd)}</div>
            <div class="cliente">${escapeHtml(o.cliente || "Cliente n/d")}</div>
            ${o.descrizione_breve
              ? `<div class="desc">${escapeHtml(o.descrizione_breve)}</div>`
              : `<div class="desc placeholder">Nessuna descrizione</div>`}
          </div>
          <span class="badge ${g.cls}"><i class="bi ${g.icon}"></i>${g.label}</span>
        </div>

        <div class="fields">
          <div class="field">
            <label><i class="bi bi-clock-history"></i> Evasione</label>
            <input type="datetime-local" id="evade_${o.id}" value="${evVal}">
          </div>
          <div class="field">
            <label><i class="bi bi-card-text"></i> Descrizione</label>
            <textarea id="desc_${o.id}">${escapeHtml(o.descrizione_breve || "")}</textarea>
          </div>
          <div class="field">
            <label><i class="bi bi-sticky"></i> Note</label>
            <textarea id="note_${o.id}">${escapeHtml(o.note_interne || "")}</textarea>
          </div>
        </div>

        <div class="card-actions">
          <button class="save-btn" data-save-id="${o.id}"><i class="bi bi-check-lg"></i> Salva</button>
          ${o.inserito_manuale ? `<button class="delete-btn" data-del-id="${o.id}"><i class="bi bi-trash"></i></button>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

async function saveOrder(id) {
  const ev = $(`evade_${id}`).value;
  const de = $(`desc_${id}`).value;
  const no = $(`note_${id}`).value;
  try {
    const { error } = await supabase.from("ordini").update({
      descrizione_breve: de,
      note_interne: no,
      data_evasione_grafica: ev ? new Date(ev).toISOString() : null
    }).eq("id", id);
    if (error) throw error;
    toast("✓ Salvato");
    await loadOrders();
  } catch (e) {
    toast("Errore: " + e.message, "error");
  }
}

  );
}
async function doClear() {
  try {
    const { error } = await supabase.from("ordini").delete().gt("id", 0);
    if (error) throw error;
    await supabase.from("meta").upsert({ id: 1, ultima_importazione: new Date().toISOString() });
    allOrders = [];
    renderOrders();
    await loadMeta();
    toast("✓ Database svuotato");
  } catch (e) { toast("Errore: " + e.message, "error"); }
}

function showModal(title, bodyHtml, buttons) {
  $("modalTitle").innerHTML = title;
  $("modalBody").innerHTML = bodyHtml;
  const wrap = $("modalButtons");
  wrap.innerHTML = "";
  buttons.forEach(b => {
    const btn = document.createElement("button");
    btn.className = b.className || "btn-ghost";
    btn.innerHTML = b.label;
    btn.onclick = () => { closeModal(); if (b.onClick) b.onClick(); };
    wrap.appendChild(btn);
  });
  $("modalBg").classList.add("active");
}
function closeModal() { $("modalBg").classList.remove("active"); }

function bindEvents() {
  $("debugToggle").onclick = () => $("debugPanel").classList.toggle("active");
  $("refreshBtn").onclick = () => { log("Refresh", "step"); loadOrders(); };
  $("clearBtn").onclick = confirmClear;

  $("csvFile").addEventListener("change", e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
    e.target.value = "";
  });

  const dz = $("dropzone");
  ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("dragover"); }));
  ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("dragover"); }));
  dz.addEventListener("drop", e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });

  $("cancelImportBtn").onclick = cancelPreview;
  $("importBtn").onclick = doImport;

  $("manualToggle").onclick = () => {
    $("manualBody").classList.toggle("active");
    const icon = $("manualToggleIcon");
    icon.className = $("manualBody").classList.contains("active") ? "bi bi-chevron-up" : "bi bi-chevron-down";
  };
  $("manualSave").onclick = saveManualOrder;

  $("searchInput").oninput = renderOrders;

  $("ordersList").addEventListener("click", e => {
    const save = e.target.closest("[data-save-id]");
    if (save) saveOrder(save.dataset.saveId);
    const del = e.target.closest("[data-del-id]");
    if (del) deleteOrder(del.dataset.delId);
  });

  $("modalBg").onclick = e => { if (e.target === $("modalBg")) closeModal(); };
}

log("Avvio...", "step");
log(`Anno corrente: ${currentYear}`, "info");
log(`Range Sit.3: ${currentYear} oppure ≥ 1 ott ${currentYear-1}`, "info");
initSupabase();
bindEvents();
loadOrders();
setInterval(() => { if (supabase) loadMeta(); }, 60000);
log("✓ Pronto", "success");
</script>
