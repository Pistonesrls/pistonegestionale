<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ordini Grafica</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:'Inter',sans-serif; background:#fff; color:#111; padding:16px; padding-bottom:60px; }
.container { max-width:860px; margin:0 auto; }
h1 { font-size:20px; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
.subtitle { font-size:12px; color:#666; margin-bottom:16px; }

/* Debug */
.debug-toggle { background:#f1f5f9; border:1px solid #e5e7eb; border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; margin-bottom:10px; display:inline-flex; align-items:center; gap:6px; font-family:inherit; }
.debug-panel { background:#1e293b; color:#e2e8f0; border-radius:10px; padding:14px; margin-bottom:16px; font-family:monospace; font-size:11px; max-height:260px; overflow-y:auto; display:none; }
.debug-panel.active { display:block; }
.debug-panel .log { padding:2px 0; border-bottom:1px solid #334155; }
.debug-panel .info { color:#60a5fa; }
.debug-panel .success { color:#4ade80; }
.debug-panel .error { color:#f87171; }
.debug-panel .warning { color:#fbbf24; }
.debug-panel .step { color:#a78bfa; font-weight:bold; }

/* Loading */
.loading-state { background:#eff6ff; border:2px solid #3b82f6; border-radius:12px; padding:20px; text-align:center; margin-bottom:16px; display:none; }
.loading-state.active { display:block; }
.loading-state h3 { font-size:15px; margin-bottom:6px; color:#1e40af; }
.loading-state .status { font-size:13px; color:#3b82f6; margin-bottom:10px; min-height:18px; }
.spinner-big { width:36px; height:36px; border:4px solid #dbeafe; border-top-color:#3b82f6; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 10px; }
.progress-bar { background:#dbeafe; border-radius:4px; height:8px; overflow:hidden; }
.progress-fill { background:#3b82f6; height:100%; width:0%; transition:width .3s; }

/* Dropzone */
.dropzone { border:2px dashed #ccc; border-radius:12px; padding:30px; text-align:center; cursor:pointer; background:#f9f9f9; margin-bottom:16px; transition:all .2s; }
.dropzone:hover,.dropzone.dragover { border-color:#2563eb; background:#f0f7ff; }
.dropzone i { font-size:30px; color:#999; display:block; margin-bottom:8px; }
.dropzone .label { font-size:14px; font-weight:600; color:#333; }
.dropzone .sublabel { font-size:12px; color:#888; margin-top:4px; }

/* Preview */
.preview { background:#f5f5f5; border:1px solid #ddd; border-radius:12px; padding:16px; margin-bottom:16px; display:none; }
.preview.active { display:block; }
.preview h3 { font-size:14px; margin-bottom:12px; }
.stats-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
.stat-box { background:#fff; border:1px solid #eee; border-radius:8px; padding:10px; text-align:center; }
.stat-box .num { font-size:22px; font-weight:700; display:block; }
.stat-box .num.ok { color:#10b981; } .stat-box .num.skip { color:#999; } .stat-box .num.total { color:#111; }
.stat-box .lbl { font-size:10px; color:#666; text-transform:uppercase; margin-top:2px; }
.reasons { background:#fff; border:1px solid #eee; border-radius:8px; padding:8px; font-size:12px; max-height:150px; overflow-y:auto; margin-bottom:12px; }
.reason { display:flex; justify-content:space-between; padding:4px 8px; border-bottom:1px solid #f5f5f5; }
.reason:last-child { border-bottom:none; }
.reason .count { font-weight:600; color:#666; }
.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

button { font-family:inherit; font-size:13px; font-weight:600; padding:11px 16px; border-radius:8px; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
button:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:#2563eb; color:#fff; }
.btn-success { background:#10b981; color:#fff; }
.btn-danger { background:#dc2626; color:#fff; }
.btn-ghost { background:#fff; color:#111; border:1px solid #ddd; }

.toolbar { display:flex; gap:8px; margin-bottom:16px; align-items:center; }
.search { flex:1; position:relative; }
.search i { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:#999; }
.search input { width:100%; padding:9px 12px 9px 34px; border:1px solid #ddd; border-radius:8px; font-size:13px; font-family:inherit; }
.search input:focus { outline:none; border-color:#2563eb; }
.icon-btn { width:38px; height:38px; padding:0; background:#fff; border:1px solid #ddd; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:#333; }
.icon-btn.danger { color:#dc2626; }

.stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
@media (max-width:640px){ .stats-row { grid-template-columns:repeat(3,1fr); } }
.s { background:#f5f5f5; border:1px solid #eee; border-radius:10px; padding:10px 6px; text-align:center; }
.s .n { font-size:18px; font-weight:700; display:block; }
.s .l { font-size:10px; color:#666; text-transform:uppercase; margin-top:2px; }

.card { background:#fff; border:1px solid #eee; border-radius:12px; padding:14px; margin-bottom:10px; }
.card.no-evade { border-left:3px solid #f59e0b; }
.card.overdue { border-left:3px solid #dc2626; background:#fef2f2; }
.card-head { display:flex; justify-content:space-between; gap:10px; margin-bottom:6px; }
.order-num { font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }
.order-date { font-size:11px; color:#888; margin-top:2px; }
.cliente { font-size:15px; font-weight:600; margin:4px 0 2px; }
.desc { font-size:12px; color:#888; font-style:italic; }
.desc.placeholder { opacity:.5; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; flex-shrink:0; }
.badge-alberto { background:#f3e8ff; color:#7c3aed; }
.badge-pietro { background:#e0f2fe; color:#0891b2; }
.badge-samuele { background:#d1fae5; color:#059669; }
.badge-salvo { background:#f1f5f9; color:#475569; }
.badge-smistare { background:#fef3c7; color:#d97706; }
.tag { display:inline-block; background:#f1f5f9; padding:2px 7px; border-radius:4px; font-size:10px; color:#64748b; font-weight:500; margin-top:4px; }
.fields { margin-top:10px; padding-top:10px; border-top:1px solid #f1f5f9; }
.field { display:grid; grid-template-columns:100px 1fr; gap:8px; align-items:flex-start; margin-bottom:8px; }
.field label { font-size:11px; color:#666; font-weight:500; padding-top:7px; }
.field input,.field textarea { width:100%; padding:7px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; font-family:inherit; }
.field input:focus,.field textarea:focus { outline:none; border-color:#2563eb; }
.field textarea { resize:vertical; min-height:36px; }
.save-btn { width:100%; padding:8px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; margin-top:4px; }

.stale-banner { display:none; background:#dc2626; color:#fff; padding:14px; border-radius:10px; text-align:center; font-weight:600; margin-bottom:16px; }
.stale-banner small { display:block; font-weight:400; opacity:.9; margin-top:4px; }
body.stale { background:#fef2f2; }
body.stale .stale-banner { display:block; }

.empty { text-align:center; padding:40px 20px; color:#999; }
.empty i { font-size:40px; margin-bottom:12px; display:block; opacity:.4; }

.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000; padding:20px; align-items:center; justify-content:center; }
.modal-bg.active { display:flex; }
.modal { background:#fff; border-radius:14px; padding:24px; max-width:440px; width:100%; }
.modal h3 { font-size:16px; margin-bottom:10px; }
.modal p { font-size:13px; color:#666; margin-bottom:18px; line-height:1.6; }
.modal-actions { display:flex; flex-direction:column; gap:8px; }
.modal-actions button { padding:11px; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div class="container">
  <div class="stale-banner">
    <i class="bi bi-exclamation-triangle-fill"></i> ATTENZIONE: DATI NON AGGIORNATI
    <small>Ultimo caricamento oltre 24h fa</small>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;">
    <div>
      <h1><i class="bi bi-list-check"></i> Ordini Grafica</h1>
      <div class="subtitle" id="lastUpdate">Caricamento...</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" onclick="loadOrders()" title="Aggiorna"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="icon-btn danger" onclick="confirmClear()" title="Svuota database"><i class="bi bi-trash"></i></button>
    </div>
  </div>

  <button class="debug-toggle" onclick="toggleDebug()"><i class="bi bi-bug"></i> Debug Console</button>
  <div class="debug-panel" id="debugPanel"></div>

  <div class="loading-state" id="loadingState">
    <div class="spinner-big"></div>
    <h3 id="loadingTitle">Elaborazione...</h3>
    <div class="status" id="loadingStatus"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="dropzone" id="dropzone">
    <i class="bi bi-cloud-upload"></i>
    <div class="label">Clicca per selezionare il CSV di Danea</div>
    <div class="sublabel">oppure trascinalo qui</div>
    <input type="file" id="csvFile" accept=".csv" style="display:none">
  </div>

  <div class="preview" id="preview">
    <h3><i class="bi bi-clipboard-data"></i> Anteprima filtraggio</h3>
    <div class="stats-grid" id="previewStats"></div>
    <div class="reasons" id="previewReasons"></div>
    <div class="actions">
      <button class="btn-ghost" onclick="cancelPreview()"><i class="bi bi-x-lg"></i> Annulla</button>
      <button class="btn-success" id="importBtn" onclick="doImport()"><i class="bi bi-cloud-arrow-up"></i> Importa nel database</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Cerca cliente, numero ordine..." oninput="renderOrders()">
    </div>
  </div>

  <div class="stats-row" id="stats"></div>
  <div id="ordersList"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-actions" id="modalButtons"></div>
  </div>
</div>

<script>
// ============ DEBUG ============
function debug(msg, type='info') {
  const p = document.getElementById('debugPanel');
  const t = new Date().toLocaleTimeString('it-IT',{hour12:false});
  const el = document.createElement('div');
  el.className = 'log ' + type;
  el.textContent = `[${t}] ${msg}`;
  p.appendChild(el);
  p.scrollTop = p.scrollHeight;
  console.log(`[${type}] ${msg}`);
}
function toggleDebug(){ document.getElementById('debugPanel').classList.toggle('active'); }
document.getElementById('debugPanel').classList.add('active');

function showLoading(title, status='', pct=0){
  document.getElementById('loadingTitle').textContent = title;
  document.getElementById('loadingStatus').textContent = status;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('loadingState').classList.add('active');
}
function updateLoading(status, pct){
  document.getElementById('loadingStatus').textContent = status;
  document.getElementById('progressFill').style.width = pct + '%';
}
function hideLoading(){ document.getElementById('loadingState').classList.remove('active'); }

debug('Avvio applicazione...', 'step');

// ============ SUPABASE ============
const SUPABASE_URL = 'https://emaiswhuznyqkzzzelvh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7xF7dZXBDOahRmdanK-cFw_jx0sO0Cw';
let supabase = null;
try {
  if (typeof window.supabase === 'undefined') throw new Error('Libreria Supabase non caricata');
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  debug('Supabase connesso', 'success');
} catch(e){
  debug('ERRORE Supabase: ' + e.message, 'error');
}

let allOrders = [];
let pendingImport = null;
const currentYear = new Date().getFullYear();
debug('Anno corrente: ' + currentYear, 'info');

// ============ PARSER CSV ROBUSTO ============
function parseCSVFields(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const fields = [];
  let field = '', inQuotes = false;
  for (let i=0; i<text.length; i++){
    const c = text[i];
    if (c === '"'){
      if (inQuotes && text[i+1] === '"'){ field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if ((c === ',' || c === '\n' || c === '\r') && !inQuotes){
      if (c === '\r' && text[i+1] === '\n') i++;
      fields.push(field);
      field = '';
    } else if (c !== '\r' && c !== '\n'){
      field += c;
    } else {
      field += c;
    }
  }
  fields.push(field);
  return fields;
}

function isItalianDate(s){
  if (!s) return false;
  s = s.trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (!m) return false;
  const d = +m[1], mo = +m[2];
  if (mo < 1 || mo > 12) return false;
  if (d < 1 || d > 31) return false;
  return true;
}
function toDate(s){
  const m = s.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  let y = +m[3]; if (y < 100) y += 2000;
  return new Date(y, +m[2]-1, +m[1]);
}
function isStato(s){
  if (!s) return false;
  s = s.toLowerCase();
  return s.includes('annullato') || s.includes('confermato') ||
         s.includes('confermare') || s.includes('concluso');
}

// Rileva l'inizio di ogni ordine: [vuoto][data][...][...][stato]
function extractRecords(fields){
  const starts = [];
  for (let i=0; i+4 < fields.length; i++){
    if (fields[i].trim() === '' && isItalianDate(fields[i+1]) && isStato(fields[i+4])){
      starts.push(i);
    }
  }
  const records = [];
  for (let k=0; k<starts.length; k++){
    const start = starts[k];
    const end = (k+1 < starts.length) ? starts[k+1] : fields.length;
    records.push(fields.slice(start, end));
  }
  return records;
}

// ============ FILTRI ============
const VALID_GRAFICI = ['', 'ALBERTO', 'ALBERTO - COMPLETATO', 'PIETRO', 'PIETRO - COMPLETATO', 'COMPLETATO', 'SAMUELE', 'SAMUELE - COMPLETATO'];
function norm(s){ return (s||'').toUpperCase().replace(/\s+/g,' ').trim(); }

function classifyRow(rec){
  // rec[0]=vuoto rec[1]=data rec[2]=operatore rec[3]=numero rec[4]=stato
  // rec[5]=grafico rec[6]=evasione rec[7]=cliente rec[8]=note rec[9]=prezzo rec[10]=settore
  if (rec.length < 8) return {valid:false, reason:'Riga troppo corta'};

  const dataStr = (rec[1]||'').trim();
  const numero  = (rec[3]||'').trim();
  const stato   = (rec[4]||'').trim();
  const grafico = norm(rec[5]);
  const cliente = (rec[7]||'').trim();
  const settore = (rec[10]||'').trim();

  if (!isItalianDate(dataStr)) return {valid:false, reason:'Data non valida'};
  const data = toDate(dataStr);
  const statoL = stato.toLowerCase();

  if (statoL.includes('annullato')) return {valid:false, reason:'Annullato'};
  if (!statoL.includes('confermato') && !statoL.includes('confermare'))
    return {valid:false, reason:'Stato: ' + (stato||'n/d')};
  if (grafico === 'SOSPESO') return {valid:false, reason:'Sospeso'};
  if (numero.toUpperCase().includes('/B')) return {valid:false, reason:'Numero /B'};
  if (!VALID_GRAFICI.includes(grafico)) return {valid:false, reason:'Grafico: ' + (rec[5]||'n/d')};

  const year = data.getFullYear();
  if (year < currentYear-1 || year > currentYear+1)
    return {valid:false, reason:'Anno ' + year};

  return {valid:true, data:{
    numero_ordine: numero,
    anno_ordine: year,
    cliente: cliente || 'Cliente n/d',
    data_ordine: data.toISOString().split('T')[0],
    grafico: (rec[5]||'').trim(),
    stato: stato,
    settore: settore
  }};
}

function processCSV(text){
  debug('═══ PROCESSAMENTO CSV ═══', 'step');
  const fields = parseCSVFields(text);
  debug('Campi totali: ' + fields.length, 'info');
  const records = extractRecords(fields);
  debug('Ordini rilevati: ' + records.length, 'info');
  if (records.length > 0) debug('Primo ordine: ' + JSON.stringify(records[0].slice(0,8)), 'info');

  const valid = [], reasons = {};
  records.forEach(rec => {
    const r = classifyRow(rec);
    if (r.valid) valid.push(r.data);
    else reasons[r.reason] = (reasons[r.reason]||0)+1;
  });

  // dedup
  const map = new Map();
  valid.forEach(o => {
    const key = o.numero_ordine + '_' + o.anno_ordine;
    if (!map.has(key) || o.anno_ordine === currentYear) map.set(key, o);
  });

  debug('Ordini validi: ' + map.size, 'success');
  debug('Scartati: ' + (records.length - valid.length), records.length>valid.length?'warning':'info');
  return {
    total: records.length,
    valid: Array.from(map.values()),
    validCount: map.size,
    skipCount: records.length - valid.length,
    reasons
  };
}

// ============ FILE INPUT ============
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('csvFile');
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
  e.target.value = '';
});

async function handleFile(file){
  debug('File: ' + file.name + ' (' + file.size + ' byte)', 'step');
  if (!file.name.toLowerCase().endsWith('.csv')){ alert('Seleziona un file CSV'); return; }

  showLoading('Lettura file...', '', 10);
  try {
    const text = await file.text();
    debug('File letto: ' + text.length + ' caratteri', 'success');
    updateLoading('Analisi e filtraggio...', 50);
    await new Promise(r => setTimeout(r, 30));

    const result = processCSV(text);
    if (result.validCount === 0){
      hideLoading();
      alert('Nessun ordine valido trovato.\nControlla la Debug Console per i motivi di scarto.');
      return;
    }
    pendingImport = result;
    showPreview(result);
    hideLoading();
    debug('Anteprima pronta: ' + result.validCount + ' ordini', 'success');
  } catch(err){
    debug('ERRORE: ' + err.message, 'error');
    hideLoading();
    alert('Errore: ' + err.message);
  }
}

function showPreview(r){
  document.getElementById('previewStats').innerHTML = `
    <div class="stat-box"><span class="num total">${r.total}</span><span class="lbl">Ordini letti</span></div>
    <div class="stat-box"><span class="num ok">${r.validCount}</span><span class="lbl">Da importare</span></div>
    <div class="stat-box"><span class="num skip">${r.skipCount}</span><span class="lbl">Scartati</span></div>`;
  const reasons = Object.entries(r.reasons).sort((a,b)=>b[1]-a[1]);
  const el = document.getElementById('previewReasons');
  el.innerHTML = reasons.length === 0
    ? '<div class="reason"><span>Nessuno scarto 🎉</span></div>'
    : reasons.map(([k,v])=>`<div class="reason"><span>${escapeHtml(k)}</span><span class="count">${v}</span></div>`).join('');
  document.getElementById('preview').classList.add('active');
}
function cancelPreview(){
  document.getElementById('preview').classList.remove('active');
  pendingImport = null;
}

// ============ IMPORT ============
async function doImport(){
  if (!pendingImport) return;
  if (!supabase){ alert('Supabase non disponibile'); return; }
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.innerHTML = 'Verifica...';
  showLoading('Verifica dati esistenti...', '', 10);
  debug('Verifica conflitti...', 'step');

  try {
    const { data: existing, error } = await supabase
      .from('ordini')
      .select('numero_ordine, anno_ordine, note_interne, descrizione_breve, data_evasione_grafica');
    if (error) throw error;

    const customMap = {};
    (existing||[]).forEach(o => {
      if (o.note_interne || o.descrizione_breve || o.data_evasione_grafica){
        customMap[o.numero_ordine + '_' + o.anno_ordine] = {
          note_interne: o.note_interne||'',
          descrizione_breve: o.descrizione_breve||'',
          data_evasione_grafica: o.data_evasione_grafica
        };
      }
    });
    const hasCustom = pendingImport.valid.some(o => customMap[o.numero_ordine+'_'+o.anno_ordine]);
    debug('Ordini con dati personalizzati: ' + Object.keys(customMap).length, 'info');
    hideLoading();

    if (hasCustom){
      showModal(
        '⚠️ Dati esistenti trovati',
        'Alcuni ordini hanno note, descrizioni o date evasione salvate. Vuoi mantenerle o sovrascrivere tutto?',
        [
          {label:'🛡️ Mantieni i dati salvati', class:'btn-primary', action:()=>runImport(pendingImport.valid, customMap)},
          {label:'🔄 Sovrascrivi tutto', class:'btn-danger', action:()=>runImport(pendingImport.valid, null)},
          {label:'Annulla', class:'btn-ghost', action:cancelPreview}
        ]
      );
    } else {
      runImport(pendingImport.valid, null);
    }
  } catch(err){
    debug('ERRORE: ' + err.message, 'error');
    hideLoading();
    alert('Errore: ' + err.message);
    btn.disabled = false; btn.innerHTML = '<i class="bi bi-cloud-arrow-up"></i> Importa nel database';
  }
}

async function runImport(orders, customMap){
  document.getElementById('preview').classList.remove('active');
  showLoading('Importazione...', 'Cancellazione dati precedenti', 5);
  debug('Import di ' + orders.length + ' ordini (keep=' + !!customMap + ')', 'step');

  try {
    const { error: delErr } = await supabase.from('ordini').delete().neq('id', -1);
    if (delErr) throw delErr;
    debug('Vecchi dati cancellati', 'success');
    updateLoading('Inserimento ordini...', 20);

    const BATCH = 100;
    let inserted = 0;
    for (let i=0; i<orders.length; i+=BATCH){
      const batch = orders.slice(i, i+BATCH);
      const { error } = await supabase.from('ordini').insert(batch);
      if (error){ debug('Errore batch: ' + error.message, 'error'); }
      else inserted += batch.length;
      updateLoading('Inserimento ' + inserted + '/' + orders.length + '...', 20 + (i/orders.length)*60);
      await new Promise(r=>setTimeout(r,10));
    }
    debug('Inseriti: ' + inserted, 'success');

    // Riapplica dati personalizzati
    if (customMap){
      updateLoading('Ripristino dati salvati...', 85);
      let restored = 0;
      const { data: newRows, error: selErr } = await supabase
        .from('ordini').select('id, numero_ordine, anno_ordine');
      if (!selErr){
        for (const row of (newRows||[])){
          const c = customMap[row.numero_ordine + '_' + row.anno_ordine];
          if (c){
            await supabase.from('ordini').update(c).eq('id', row.id);
            restored++;
          }
        }
        debug('Ripristinati: ' + restored, 'success');
      }
    }

    await supabase.from('meta').update({ultima_importazione:new Date().toISOString()}).eq('id',1);
    updateLoading('Completato ✓', 100);
    hideLoading();
    cancelPreview();
    loadOrders();
  } catch(err){
    debug('ERRORE import: ' + err.message, 'error');
    hideLoading();
    alert('Errore import: ' + err.message);
  }
}

// ============ LOAD ============
async function loadOrders(){
  debug('Caricamento ordini...', 'step');
  const list = document.getElementById('ordersList');
  list.innerHTML = '<div class="empty"><i class="bi bi-hourglass-split"></i>Caricamento...</div>';
  if (!supabase){ list.innerHTML = '<div class="empty">Supabase non disponibile</div>'; return; }
  try {
    const { data, error } = await supabase
      .from('ordini').select('*')
      .order('data_evasione_grafica', {ascending:true, nullsFirst:true})
      .order('data_ordine', {ascending:false});
    if (error) throw error;
    allOrders = data || [];
    debug('Caricati ' + allOrders.length + ' ordini', 'success');
    renderOrders();
    loadMeta();
  } catch(err){
    debug('ERRORE: ' + err.message, 'error');
    list.innerHTML = '<div class="empty"><i class="bi bi-exclamation-triangle"></i>Errore: ' + err.message + '</div>';
  }
}
async function loadMeta(){
  try {
    const { data } = await supabase.from('meta').select('ultima_importazione').eq('id',1).maybeSingle();
    const el = document.getElementById('lastUpdate');
    if (data && data.ultima_importazione){
      const d = new Date(data.ultima_importazione);
      const diff = (Date.now()-d.getTime())/3600000;
      el.innerHTML = '<i class="bi bi-clock"></i> Aggiornato ' + d.toLocaleString('it-IT',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      document.body.classList.toggle('stale', diff > 24);
    } else el.textContent = 'Nessun aggiornamento';
  } catch(e){ debug('Errore meta: '+e.message,'error'); }
}

// ============ RENDER ============
function getGraficoInfo(g){
  g = norm(g);
  if (!g) return {name:'Da smistare', class:'badge-smistare', icon:'person-plus'};
  if (g === 'COMPLETATO') return {name:'Salvo G.', class:'badge-salvo', icon:'person-check'};
  if (g.includes('ALBERTO')) return {name:'Alberto', class:'badge-alberto', icon:'person'};
  if (g.includes('PIETRO')) return {name:'Pietro', class:'badge-pietro', icon:'person'};
  if (g.includes('SAMUELE')) return {name:'Samuele', class:'badge-samuele', icon:'person'};
  return {name:g, class:'badge-salvo', icon:'person'};
}
function renderCard(o){
  const g = getGraficoInfo(o.grafico);
  const hasEv = !!o.data_evasione_grafica;
  const overdue = hasEv && new Date(o.data_evasione_grafica) < new Date();
  const cls = !hasEv ? 'no-evade' : (overdue ? 'overdue' : '');
  const evVal = o.data_evasione_grafica ? new Date(o.data_evasione_grafica).toISOString().slice(0,16) : '';
  const dOrd = o.data_ordine ? new Date(o.data_ordine).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'}) : '';
  return `
    <div class="card ${cls}">
      <div class="card-head">
        <div>
          <div class="order-num"><i class="bi bi-hash"></i>${escapeHtml(o.numero_ordine)}
            ${o.settore ? `<span class="tag">${escapeHtml(o.settore)}</span>` : ''}
          </div>
          <div class="order-date"><i class="bi bi-calendar3"></i> ${dOrd}</div>
          <div class="cliente">${escapeHtml(o.cliente||'Cliente n/d')}</div>
          ${o.descrizione_breve ? `<div class="desc">${escapeHtml(o.descrizione_breve)}</div>` : `<div class="desc placeholder">Nessuna descrizione</div>`}
        </div>
        <span class="badge ${g.class}"><i class="bi bi-${g.icon}"></i>${g.name}</span>
      </div>
      <div class="fields">
        <div class="field"><label><i class="bi bi-clock-history"></i> Evasione</label>
          <input type="datetime-local" id="evade_${o.id}" value="${evVal}"></div>
        <div class="field"><label><i class="bi bi-card-text"></i> Descrizione</label>
          <textarea id="desc_${o.id}">${escapeHtml(o.descrizione_breve||'')}</textarea></div>
        <div class="field"><label><i class="bi bi-sticky"></i> Note</label>
          <textarea id="note_${o.id}">${escapeHtml(o.note_interne||'')}</textarea></div>
        <button class="save-btn" onclick="saveOrder(${o.id})"><i class="bi bi-check-lg"></i> Salva</button>
      </div>
    </div>`;
}
function renderOrders(){
  const list = document.getElementById('ordersList');
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let vis = allOrders;
  if (q) vis = vis.filter(o =>
    (o.cliente||'').toLowerCase().includes(q) ||
    (o.numero_ordine||'').toLowerCase().includes(q) ||
    (o.descrizione_breve||'').toLowerCase().includes(q) ||
    (o.note_interne||'').toLowerCase().includes(q));

  const st = {
    tot: vis.length,
    smist: vis.filter(o=>!norm(o.grafico)).length,
    alb: vis.filter(o=>norm(o.grafico).includes('ALBERTO')).length,
    pie: vis.filter(o=>norm(o.grafico).includes('PIETRO')).length,
    sam: vis.filter(o=>norm(o.grafico).includes('SAMUELE')).length
  };
  document.getElementById('stats').innerHTML = `
    <div class="s"><span class="n">${st.tot}</span><span class="l">Totale</span></div>
    <div class="s"><span class="n" style="color:#d97706">${st.smist}</span><span class="l">Da smistare</span></div>
    <div class="s"><span class="n" style="color:#7c3aed">${st.alb}</span><span class="l">Alberto</span></div>
    <div class="s"><span class="n" style="color:#0891b2">${st.pie}</span><span class="l">Pietro</span></div>
    <div class="s"><span class="n" style="color:#059669">${st.sam}</span><span class="l">Samuele</span></div>`;

  if (vis.length === 0){
    list.innerHTML = `<div class="empty"><i class="bi bi-inbox"></i>${q?'Nessun risultato':'Nessun ordine'}${q?'':'<br><small>Carica un CSV per iniziare</small>'}</div>`;
    return;
  }
  list.innerHTML = vis.map(renderCard).join('');
}

async function saveOrder(id){
  const ev = document.getElementById('evade_'+id).value;
  const de = document.getElementById('desc_'+id).value;
  const no = document.getElementById('note_'+id).value;
  try {
    const { error } = await supabase.from('ordini').update({
      descrizione_breve: de, note_interne: no,
      data_evasione_grafica: ev ? new Date(ev).toISOString() : null
    }).eq('id', id);
    if (error) throw error;
    const o = allOrders.find(x=>x.id===id);
    if (o){ o.descrizione_breve=de; o.note_interne=no; o.data_evasione_grafica=ev?new Date(ev).toISOString():null; }
    renderOrders();
    debug('Ordine ' + id + ' salvato', 'success');
  } catch(e){ alert('Errore: '+e.message); debug('Errore save: '+e.message,'error'); }
}

function confirmClear(){
  showModal('⚠️ Svuotare il database?', 'Tutti gli ordini verranno cancellati definitivamente.', [
    {label:'Sì, svuota tutto', class:'btn-danger', action:doClear},
    {label:'Annulla', class:'btn-ghost', action:()=>{}}
  ]);
}
async function doClear(){
  try {
    const { error } = await supabase.from('ordini').delete().neq('id', -1);
    if (error) throw error;
    await supabase.from('meta').update({ultima_importazione:new Date().toISOString()}).eq('id',1);
    allOrders = []; renderOrders(); loadMeta();
    debug('Database svuotato', 'success');
  } catch(e){ alert('Errore: '+e.message); }
}

function escapeHtml(s){
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showModal(title, text, buttons){
  document.getElementById('modalTitle').innerHTML = title;
  document.getElementById('modalText').innerHTML = text;
  const b = document.getElementById('modalButtons');
  b.innerHTML = '';
  buttons.forEach(x=>{
    const btn = document.createElement('button');
    btn.innerHTML = x.label; btn.className = x.class;
    btn.onclick = ()=>{ document.getElementById('modal').classList.remove('active'); if(x.action)x.action(); };
    b.appendChild(btn);
  });
  document.getElementById('modal').classList.add('active');
}

loadOrders();
debug('Pronto', 'success');
</script>
