<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ordini Grafica</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #fff; color: #111; padding: 16px; padding-bottom: 60px; }
.container { max-width: 860px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.subtitle { font-size: 12px; color: #666; margin-bottom: 20px; }
.dropzone { border: 2px dashed #ccc; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; background: #f9f9f9; margin-bottom: 16px; transition: all 0.2s; }
.dropzone:hover { border-color: #2563eb; background: #f0f7ff; }
.dropzone i { font-size: 32px; color: #999; display: block; margin-bottom: 8px; }
.dropzone .label { font-size: 14px; font-weight: 600; color: #333; }
.dropzone .sublabel { font-size: 12px; color: #888; margin-top: 4px; }
.preview { background: #f5f5f5; border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none; }
.preview.active { display: block; }
.preview h3 { font-size: 14px; margin-bottom: 12px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: white; border: 1px solid #eee; border-radius: 8px; padding: 10px; text-align: center; }
.stat .num { font-size: 22px; font-weight: 700; display: block; }
.stat .num.ok { color: #10b981; }
.stat .num.skip { color: #999; }
.stat .num.total { color: #111; }
.stat .lbl { font-size: 10px; color: #666; text-transform: uppercase; margin-top: 2px; }
.reasons { background: white; border: 1px solid #eee; border-radius: 8px; padding: 8px; font-size: 12px; max-height: 150px; overflow-y: auto; margin-bottom: 12px; }
.reason { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid #f5f5f5; }
.reason:last-child { border-bottom: none; }
.reason .count { font-weight: 600; color: #666; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button { font-family: inherit; font-size: 13px; font-weight: 600; padding: 11px 16px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-primary { background: #2563eb; color: white; }
.btn-success { background: #10b981; color: white; }
.btn-danger { background: #dc2626; color: white; }
.btn-ghost { background: white; color: #111; border: 1px solid #ddd; }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
.search { flex: 1; position: relative; }
.search i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #999; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; font-family: inherit; }
.search input:focus { outline: none; border-color: #2563eb; }
.icon-btn { width: 38px; height: 38px; padding: 0; background: white; border: 1px solid #ddd; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #333; }
.icon-btn.danger { color: #dc2626; }
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
@media (max-width: 640px) { .stats-row { grid-template-columns: repeat(3, 1fr); } }
.s { background: #f5f5f5; border: 1px solid #eee; border-radius: 10px; padding: 10px 6px; text-align: center; }
.s .n { font-size: 18px; font-weight: 700; display: block; }
.s .l { font-size: 10px; color: #666; text-transform: uppercase; margin-top: 2px; }
.card { background: white; border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card.no-evade { border-left: 3px solid #f59e0b; }
.card.overdue { border-left: 3px solid #dc2626; background: #fef2f2; }
.card-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.order-num { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
.order-date { font-size: 11px; color: #888; margin-top: 2px; }
.cliente { font-size: 15px; font-weight: 600; margin: 4px 0 2px; }
.desc { font-size: 12px; color: #888; font-style: italic; }
.desc.placeholder { opacity: 0.5; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
.badge-alberto { background: #f3e8ff; color: #7c3aed; }
.badge-pietro { background: #e0f2fe; color: #0891b2; }
.badge-samuele { background: #d1fae5; color: #059669; }
.badge-salvo { background: #f1f5f9; color: #475569; }
.badge-smistare { background: #fef3c7; color: #d97706; }
.tag { display: inline-block; background: #f1f5f9; padding: 2px 7px; border-radius: 4px; font-size: 10px; color: #64748b; font-weight: 500; margin-top: 4px; }
.tag.highlight { background: #fef3c7; color: #d97706; font-weight: 600; }
.fields { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; }
.field { display: grid; grid-template-columns: 100px 1fr; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.field label { font-size: 11px; color: #666; font-weight: 500; padding-top: 7px; }
.field input, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: inherit; }
.field input:focus, .field textarea:focus { outline: none; border-color: #2563eb; }
.field textarea { resize: vertical; min-height: 36px; }
.save-btn { width: 100%; padding: 8px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px; }
.stale-banner { display: none; background: #dc2626; color: white; padding: 14px; border-radius: 10px; text-align: center; font-weight: 600; margin-bottom: 16px; }
.stale-banner small { display: block; font-weight: 400; opacity: 0.9; margin-top: 4px; }
body.stale { background: #fef2f2; }
body.stale .stale-banner { display: block; }
.empty { text-align: center; padding: 40px 20px; color: #999; }
.empty i { font-size: 40px; margin-bottom: 12px; display: block; opacity: 0.4; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
.modal-bg.active { display: flex; }
.modal { background: white; border-radius: 14px; padding: 24px; max-width: 440px; width: 100%; }
.modal h3 { font-size: 16px; margin-bottom: 10px; }
.modal p { font-size: 13px; color: #666; margin-bottom: 18px; line-height: 1.6; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; }
.modal-actions button { padding: 11px; }
</style>
</head>
<body>

<div class="container">
  <div class="stale-banner" id="staleBanner">
    <i class="bi bi-exclamation-triangle-fill"></i> ATTENZIONE: DATI NON AGGIORNATI
    <small>Ultimo caricamento oltre 24h fa</small>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
    <div>
      <h1><i class="bi bi-list-check"></i> Ordini Grafica</h1>
      <div class="subtitle" id="lastUpdate">Caricamento...</div>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="icon-btn" onclick="loadOrders()" title="Aggiorna"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="icon-btn danger" onclick="confirmClear()" title="Svuota database"><i class="bi bi-trash"></i></button>
    </div>
  </div>

  <div class="dropzone" onclick="document.getElementById('csvFile').click()">
    <i class="bi bi-cloud-upload"></i>
    <div class="label">Clicca per selezionare il CSV di Danea</div>
    <div class="sublabel">oppure trascinalo qui</div>
    <input type="file" id="csvFile" accept=".csv" onchange="handleFile(this)" style="display:none">
  </div>

  <div class="preview" id="preview">
    <h3><i class="bi bi-clipboard-data"></i> Anteprima filtraggio</h3>
    <div class="stats" id="previewStats"></div>
    <div class="reasons" id="previewReasons"></div>
    <div class="actions">
      <button class="btn-ghost" onclick="cancelPreview()"><i class="bi bi-x-lg"></i> Annulla</button>
      <button class="btn-success" onclick="doImport()"><i class="bi bi-cloud-arrow-up"></i> Importa nel database</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Cerca cliente, numero ordine..." oninput="renderOrders()">
    </div>
  </div>

  <div class="stats-row" id="stats"></div>

  <div id="ordersList"></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <div class="modal-actions" id="modalButtons"></div>
  </div>
</div>

<script>
console.log('Script caricato');

const SUPABASE_URL = 'https://emaiswhuznyqkzzzelvh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7xF7dZXBDOahRmdanK-cFw_jx0sO0Cw';

let supabase = null;
let allOrders = [];
let pendingImport = null;
const currentYear = new Date().getFullYear();

// Init Supabase
try {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  console.log('Supabase inizializzato');
} catch (e) {
  console.error('Errore init Supabase:', e);
  alert('Errore init Supabase: ' + e.message);
}

// ============ CSV PARSER ROBUSTO ============
function parseCSV(text) {
  console.log('Parsing CSV, lunghezza:', text.length);
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  
  // Normalizza line endings
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === '"') {
      if (inQuotes && text[i+1] === '"') { field += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      row.push(field);
      field = '';
    } else if (c === '\n' && !inQuotes) {
      row.push(field);
      if (row.some(f => f.trim())) rows.push(row);
      row = [];
      field = '';
    } else {
      field += c;
    }
  }
  if (field || row.length) {
    row.push(field);
    if (row.some(f => f.trim())) rows.push(row);
  }
  console.log('Righe parsate:', rows.length);
  return rows;
}

function parseItalianDate(s) {
  if (!s) return null;
  s = s.trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (!m) return null;
  let y = parseInt(m[3]);
  if (y < 100) y += 2000;
  return new Date(y, parseInt(m[2])-1, parseInt(m[1]));
}

// ============ FILTRI ============
function classifyRow(row) {
  if (row.length < 11) return { valid: false, reason: 'Riga incompleta' };

  const dataOrdineStr = (row[1] || '').trim();
  const numero = (row[3] || '').trim();
  const stato = (row[4] || '').trim();
  const grafico = (row[5] || '').trim();
  const cliente = (row[7] || '').trim();
  const note = (row[8] || '').trim();
  const settore = (row[10] || '').trim();

  const dataOrdine = parseItalianDate(dataOrdineStr);
  if (!dataOrdine) return { valid: false, reason: 'Data ordine non valida' };

  const statoLower = stato.toLowerCase();
  const graficoUpper = grafico.toUpperCase().replace(/\s+/g, ' ').trim();

  // 1. Escludi Annullati
  if (statoLower.includes('annullato')) return { valid: false, reason: 'Annullato' };

  // 2. Solo Da confermare o Confermato
  if (!statoLower.includes('da confermare') && !statoLower.includes('confermato')) {
    return { valid: false, reason: `Stato: ${stato || 'n/d'}` };
  }

  // 3. Escludi SOSPESO
  if (graficoUpper === 'SOSPESO' || statoLower.includes('sospeso') || note.toUpperCase().includes('SOSPESO')) {
    return { valid: false, reason: 'Sospeso' };
  }

  // 4. Escludi /B
  if (numero.toUpperCase().includes('/B')) return { valid: false, reason: 'Numero /B' };

  // 5. Escludi SALVO G. - COMPLETATO e FABRIS
  if (graficoUpper.includes('SALVO G.') || graficoUpper.includes('FABRIS')) {
    return { valid: false, reason: `Grafico: ${grafico}` };
  }

  // 6. Grafico valido (o vuoto)
  const graficiValidi = ['ALBERTO', 'ALBERTO - COMPLETATO', 'PIETRO', 'PIETRO - COMPLETATO', 
                          'COMPLETATO', 'SAMUELE', 'SAMUELE - COMPLETATO'];
  if (graficoUpper && !graficiValidi.includes(graficoUpper)) {
    return { valid: false, reason: `Grafico non valido: ${grafico}` };
  }

  // 7. Filtro anno
  const year = dataOrdine.getFullYear();
  if (year < currentYear - 1 || year > currentYear + 1) {
    return { valid: false, reason: `Anno ${year}` };
  }

  return {
    valid: true,
    data: {
      numero_ordine: numero,
      anno_ordine: year,
      cliente: cliente,
      data_ordine: dataOrdine.toISOString().split('T')[0],
      grafico: grafico,
      stato: stato,
      settore: settore
    }
  };
}

// ============ PROCESSAMENTO ============
function processCSV(text) {
  console.log('Processamento CSV...');
  const rows = parseCSV(text);
  const valid = [];
  const reasons = {};
  let totalRows = 0;

  rows.forEach(row => {
    // Salta header
    if (row[1] && /data/i.test(row[1]) && /numero/i.test(row[3] || '')) return;
    
    totalRows++;
    const result = classifyRow(row);
    if (result.valid) {
      valid.push(result.data);
    } else {
      reasons[result.reason] = (reasons[result.reason] || 0) + 1;
    }
  });

  // Deduplica
  const unique = new Map();
  valid.forEach(o => {
    const key = `${o.numero_ordine}_${o.anno_ordine}`;
    if (!unique.has(key) || o.anno_ordine === currentYear) {
      unique.set(key, o);
    }
  });

  return {
    total: totalRows,
    valid: Array.from(unique.values()),
    validCount: unique.size,
    skipCount: totalRows - valid.length,
    reasons
  };
}

// ============ DRAG & DROP ============
const dropzone = document.querySelector('.dropzone');
dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.style.borderColor = '#2563eb';
  dropzone.style.background = '#f0f7ff';
});
dropzone.addEventListener('dragleave', () => {
  dropzone.style.borderColor = '#ccc';
  dropzone.style.background = '#f9f9f9';
});
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.style.borderColor = '#ccc';
  dropzone.style.background = '#f9f9f9';
  if (e.dataTransfer.files[0]) {
    document.getElementById('csvFile').files = e.dataTransfer.files;
    handleFile(document.getElementById('csvFile'));
  }
});

function handleFile(input) {
  console.log('handleFile chiamata');
  const file = input.files[0];
  if (!file) {
    console.log('Nessun file');
    return;
  }
  console.log('File:', file.name, file.size);
  
  if (!file.name.toLowerCase().endsWith('.csv')) {
    alert('Seleziona un file CSV');
    return;
  }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    console.log('File letto');
    try {
      const text = e.target.result;
      const result = processCSV(text);
      console.log('Risultato:', result);
      
      pendingImport = result;
      showPreview(result);
    } catch (err) {
      console.error('Errore:', err);
      alert('Errore elaborazione: ' + err.message);
    }
  };
  reader.onerror = function() {
    alert('Errore lettura file');
  };
  reader.readAsText(file);
}

function showPreview(result) {
  document.getElementById('previewStats').innerHTML = `
    <div class="stat">
      <span class="num total">${result.total}</span>
      <span class="lbl">Righe lette</span>
    </div>
    <div class="stat">
      <span class="num ok">${result.validCount}</span>
      <span class="lbl">Da importare</span>
    </div>
    <div class="stat">
      <span class="num skip">${result.skipCount}</span>
      <span class="lbl">Scartati</span>
    </div>
  `;
  
  const reasons = Object.entries(result.reasons).sort((a,b) => b[1]-a[1]);
  const reasonsEl = document.getElementById('previewReasons');
  if (reasons.length === 0) {
    reasonsEl.innerHTML = '<div class="reason"><span>Nessun ordine scartato 🎉</span></div>';
  } else {
    reasonsEl.innerHTML = reasons.map(([reason, count]) => 
      `<div class="reason"><span>${escapeHtml(reason)}</span><span class="count">${count}</span></div>`
    ).join('');
  }
  
  document.getElementById('preview').classList.add('active');
}

function cancelPreview() {
  document.getElementById('preview').classList.remove('active');
  pendingImport = null;
  document.getElementById('csvFile').value = '';
}

async function doImport() {
  if (!pendingImport) return;
  console.log('doImport, ordini:', pendingImport.valid.length);
  
  if (pendingImport.valid.length === 0) {
    alert('Nessun ordine valido da importare');
    cancelPreview();
    return;
  }
  
  try {
    console.log('Verifica conflitti...');
    const numeri = pendingImport.valid.map(o => o.numero_ordine);
    const { data: existing } = await supabase
      .from('ordini')
      .select('numero_ordine, anno_ordine, note_interne, descrizione_breve, data_evasione_grafica')
      .in('numero_ordine', numeri);
    
    const existingMap = {};
    (existing || []).forEach(o => {
      existingMap[`${o.numero_ordine}_${o.anno_ordine}`] = o;
    });
    
    const hasCustomData = pendingImport.valid.some(o => {
      const ex = existingMap[`${o.numero_ordine}_${o.anno_ordine}`];
      return ex && (ex.note_interne || ex.descrizione_breve || ex.data_evasione_grafica);
    });
    
    if (hasCustomData) {
      showModal(
        '⚠️ Dati esistenti trovati',
        'Alcuni ordini hanno note, descrizioni o date evasione inserite manualmente. Come vuoi procedere?',
        [
          { label: 'Mantieni dati esistenti', class: 'btn-ghost', action: () => importToDB(false) },
          { label: 'Sovrascrivi tutto', class: 'btn-danger', action: () => importToDB(true) },
          { label: 'Annulla', class: 'btn-ghost', action: cancelPreview }
        ]
      );
    } else {
      importToDB(true);
    }
  } catch (err) {
    console.error('Errore:', err);
    alert('Errore: ' + err.message);
  }
}

async function importToDB(overwrite) {
  console.log('Import DB, overwrite:', overwrite);
  document.getElementById('preview').classList.remove('active');
  
  try {
    if (overwrite) {
      const BATCH = 100;
      let inserted = 0;
      
      for (let i = 0; i < pendingImport.valid.length; i += BATCH) {
        const batch = pendingImport.valid.slice(i, i + BATCH);
        console.log(`Batch ${i/BATCH + 1}, elementi:`, batch.length);
        const { data, error } = await supabase
          .from('ordini')
          .upsert(batch, { onConflict: 'numero_ordine,anno_ordine' })
          .select();
        
        if (error) {
          console.error('Errore batch:', error);
          alert('Errore batch: ' + error.message);
        } else {
          inserted += (data || []).length;
        }
      }
      
      await supabase.from('meta').update({ ultima_importazione: new Date().toISOString() }).eq('id', 1);
      alert(`Importati ${inserted} ordini`);
    }
    
    cancelPreview();
    await loadOrders();
  } catch (err) {
    console.error('Errore:', err);
    alert('Errore: ' + err.message);
  }
}

// ============ CARICAMENTO ============
async function loadOrders() {
  console.log('Caricamento ordini...');
  const list = document.getElementById('ordersList');
  list.innerHTML = '<div class="empty"><i class="bi bi-hourglass-split"></i>Caricamento...</div>';
  
  try {
    const { data, error } = await supabase
      .from('ordini')
      .select('*')
      .order('data_evasione_grafica', { ascending: true, nullsFirst: true })
      .order('data_ordine', { ascending: false });
    
    if (error) throw error;
    
    allOrders = data || [];
    console.log('Ordini caricati:', allOrders.length);
    renderOrders();
    await loadMeta();
  } catch (err) {
    console.error('Errore:', err);
    list.innerHTML = `<div class="empty"><i class="bi bi-exclamation-triangle"></i>Errore: ${err.message}</div>`;
  }
}

async function loadMeta() {
  try {
    const { data } = await supabase.from('meta').select('ultima_importazione').eq('id', 1).maybeSingle();
    const el = document.getElementById('lastUpdate');
    
    if (data && data.ultima_importazione) {
      const date = new Date(data.ultima_importazione);
      const diff = (Date.now() - date.getTime()) / (1000 * 60 * 60);
      const formatted = date.toLocaleString('it-IT', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
      el.innerHTML = `<i class="bi bi-clock"></i> Aggiornato ${formatted}`;
      document.body.classList.toggle('stale', diff > 24);
    } else {
      el.innerHTML = '<i class="bi bi-clock"></i> Nessun aggiornamento';
    }
  } catch (err) {
    console.error('Errore meta:', err);
  }
}

// ============ RENDERING ============
function getGraficoInfo(grafico) {
  const g = (grafico || '').toUpperCase().trim();
  if (!g) return { name: 'Da smistare', class: 'badge-smistare', icon: 'person-plus' };
  if (g === 'COMPLETATO') return { name: 'Salvo G.', class: 'badge-salvo', icon: 'person-check' };
  if (g.includes('ALBERTO')) return { name: 'Alberto', class: 'badge-alberto', icon: 'person' };
  if (g.includes('PIETRO')) return { name: 'Pietro', class: 'badge-pietro', icon: 'person' };
  if (g.includes('SAMUELE')) return { name: 'Samuele', class: 'badge-samuele', icon: 'person' };
  return { name: g, class: 'badge-salvo', icon: 'person' };
}

function renderCard(o) {
  const g = getGraficoInfo(o.grafico);
  const settore = (o.settore || '').toUpperCase();
  const hasEvasione = !!o.data_evasione_grafica;
  const now = new Date();
  const isOverdue = hasEvasione && new Date(o.data_evasione_grafica) < now;
  let stateClass = '';
  if (!hasEvasione) stateClass = 'no-evade';
  else if (isOverdue) stateClass = 'overdue';
  
  const settoreHighlight = ['PLOTTER', 'INSEGNE', 'FURGONE'].some(s => settore.includes(s));
  const dataEvasioneVal = o.data_evasione_grafica ? new Date(o.data_evasione_grafica).toISOString().slice(0,16) : '';
  const dataOrdine = new Date(o.data_ordine).toLocaleDateString('it-IT', { day: '2-digit', month: 'short', year: 'numeric' });
  
  return `
    <div class="card ${stateClass}" data-id="${o.id}">
      <div class="card-head">
        <div>
          <div class="order-num">
            <i class="bi bi-hash"></i>
            ${escapeHtml(o.numero_ordine)}
            <span class="tag${settoreHighlight ? ' highlight' : ''}">${escapeHtml(o.settore || '')}</span>
          </div>
          <div class="order-date"><i class="bi bi-calendar3"></i> ${dataOrdine}</div>
          <div class="cliente">${escapeHtml(o.cliente || 'Cliente n/d')}</div>
          ${o.descrizione_breve 
            ? `<div class="desc">${escapeHtml(o.descrizione_breve)}</div>`
            : `<div class="desc placeholder">Nessuna descrizione</div>`
          }
        </div>
        <span class="badge ${g.class}">
          <i class="bi bi-${g.icon}"></i>
          ${g.name}
        </span>
      </div>
      
      <div class="fields">
        <div class="field">
          <label><i class="bi bi-clock-history"></i> Evasione</label>
          <input type="datetime-local" id="evade_${o.id}" value="${dataEvasioneVal}">
        </div>
        <div class="field">
          <label><i class="bi bi-card-text"></i> Descrizione</label>
          <textarea id="desc_${o.id}" placeholder="Breve descrizione visibile...">${escapeHtml(o.descrizione_breve || '')}</textarea>
        </div>
        <div class="field">
          <label><i class="bi bi-sticky"></i> Note</label>
          <textarea id="note_${o.id}" placeholder="Note interne...">${escapeHtml(o.note_interne || '')}</textarea>
        </div>
        <button class="save-btn" onclick="saveOrder(${o.id})"><i class="bi bi-check-lg"></i> Salva</button>
      </div>
    </div>
  `;
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  
  let visible = allOrders;
  if (search) {
    visible = visible.filter(o => 
      (o.cliente || '').toLowerCase().includes(search) ||
      (o.numero_ordine || '').toLowerCase().includes(search) ||
      (o.descrizione_breve || '').toLowerCase().includes(search) ||
      (o.note_interne || '').toLowerCase().includes(search)
    );
  }
  
  const stats = {
    totale: visible.length,
    daSmistare: visible.filter(o => !o.grafico).length,
    alberto: visible.filter(o => (o.grafico || '').toUpperCase().includes('ALBERTO')).length,
    pietro: visible.filter(o => (o.grafico || '').toUpperCase().includes('PIETRO')).length,
    samuele: visible.filter(o => (o.grafico || '').toUpperCase().includes('SAMUELE')).length,
  };
  
  document.getElementById('stats').innerHTML = `
    <div class="s"><span class="n">${stats.totale}</span><span class="l">Totale</span></div>
    <div class="s"><span class="n" style="color:#d97706">${stats.daSmistare}</span><span class="l">Da smistare</span></div>
    <div class="s"><span class="n" style="color:#7c3aed">${stats.alberto}</span><span class="l">Alberto</span></div>
    <div class="s"><span class="n" style="color:#0891b2">${stats.pietro}</span><span class="l">Pietro</span></div>
    <div class="s"><span class="n" style="color:#059669">${stats.samuele}</span><span class="l">Samuele</span></div>
  `;
  
  if (visible.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <i class="bi bi-inbox"></i>
        ${search ? 'Nessun risultato' : 'Nessun ordine'}
        ${search ? '' : '<br><small>Carica un CSV per iniziare</small>'}
      </div>
    `;
    return;
  }
  
  list.innerHTML = visible.map(o => renderCard(o)).join('');
}

// ============ SALVATAGGIO ============
async function saveOrder(id) {
  console.log('Salvataggio ordine', id);
  const evasione = document.getElementById(`evade_${id}`).value;
  const desc = document.getElementById(`desc_${id}`).value;
  const note = document.getElementById(`note_${id}`).value;
  
  try {
    const update = {
      descrizione_breve: desc,
      note_interne: note,
      data_evasione_grafica: evasione ? new Date(evasione).toISOString() : null
    };
    
    const { error } = await supabase.from('ordini').update(update).eq('id', id);
    if (error) throw error;
    
    const ord = allOrders.find(o => o.id === id);
    if (ord) Object.assign(ord, update);
    
    alert('Salvato');
    renderOrders();
  } catch (err) {
    console.error('Errore:', err);
    alert('Errore: ' + err.message);
  }
}

// ============ SVUOTA ============
function confirmClear() {
  showModal(
    '⚠️ Svuotare il database?',
    'Tutti gli ordini verranno cancellati. Questa azione è irreversibile.',
    [
      { label: 'Sì, svuota tutto', class: 'btn-danger', action: doClear },
      { label: 'Annulla', class: 'btn-ghost', action: () => {} }
    ]
  );
}

async function doClear() {
  try {
    const { error } = await supabase.from('ordini').delete().neq('id', -1);
    if (error) throw error;
    
    await supabase.from('meta').update({ ultima_importazione: new Date().toISOString() }).eq('id', 1);
    alert('Database svuotato');
    allOrders = [];
    renderOrders();
    loadMeta();
  } catch (err) {
    console.error('Errore:', err);
    alert('Errore: ' + err.message);
  }
}

// ============ UTILS ============
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showModal(title, text, buttons) {
  document.getElementById('modalTitle').innerHTML = title;
  document.getElementById('modalText').innerHTML = text;
  const btns = document.getElementById('modalButtons');
  btns.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.innerHTML = b.label;
    btn.className = b.class;
    btn.onclick = () => { 
      document.getElementById('modal').classList.remove('active'); 
      if (b.action) b.action(); 
    };
    btns.appendChild(btn);
  });
  document.getElementById('modal').classList.add('active');
}

console.log('Init...');
loadOrders();
