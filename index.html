<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ordini Grafica</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f8f9fa;
  --border: #e5e7eb;
  --text: #111827;
  --text-muted: #6b7280;
  --accent: #2563eb;
  --success: #059669;
  --danger: #dc2626;
  --warning: #d97706;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  padding-bottom: 80px;
}

body.stale { background: #fef2f2; }
body.stale .stale-banner { display: block; }

.container { max-width: 860px; margin: 0 auto; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
}

h1 {
  font-size: 20px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

.header-actions { display: flex; gap: 8px; }

.icon-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
}

.icon-btn.danger { color: var(--danger); }

button {
  font-family: inherit;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary { background: var(--accent); color: #fff; padding: 10px 14px; }
.btn-success { background: var(--success); color: #fff; padding: 10px 14px; }
.btn-danger { background: var(--danger); color: #fff; padding: 10px 14px; }
.btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--text); padding: 10px 14px; }
.btn-small { padding: 7px 10px; font-size: 12px; }

.stale-banner {
  display: none;
  background: var(--danger);
  color: #fff;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
  font-weight: 700;
  margin-bottom: 16px;
}

.stale-banner small {
  display: block;
  font-weight: 400;
  opacity: 0.9;
  margin-top: 4px;
}

.debug-panel {
  display: none;
  background: #0f172a;
  color: #e2e8f0;
  border-radius: 10px;
  padding: 12px;
  font-family: monospace;
  font-size: 11px;
  max-height: 280px;
  overflow: auto;
  margin: 10px 0 16px;
}

.debug-panel.active { display: block; }
.debug-panel .info { color: #93c5fd; }
.debug-panel .success { color: #86efac; }
.debug-panel .warning { color: #fde047; }
.debug-panel .error { color: #fca5a5; }
.debug-panel .step { color: #c4b5fd; font-weight: 700; }

.loading {
  display: none;
  border: 1px solid #bfdbfe;
  background: #eff6ff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.loading.active { display: block; }

.loading-title {
  font-weight: 700;
  color: #1d4ed8;
  margin-bottom: 6px;
}

.loading-status {
  font-size: 13px;
  color: #2563eb;
  margin-bottom: 10px;
  min-height: 18px;
}

.progress {
  height: 8px;
  background: #dbeafe;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.2s ease;
}

label.dropzone {
  display: block;
  border: 2px dashed #cbd5e1;
  background: var(--bg-soft);
  border-radius: 12px;
  padding: 28px 16px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 16px;
}

label.dropzone.dragover {
  border-color: var(--accent);
  background: #eff6ff;
}

.dropzone-icon {
  font-size: 30px;
  color: #94a3b8;
  display: block;
  margin-bottom: 8px;
}

.dropzone-label { font-weight: 700; }
.dropzone-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.preview {
  display: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  background: var(--bg-soft);
  margin-bottom: 16px;
}

.preview.active { display: block; }

.preview h3 {
  font-size: 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.preview-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.stat-mini {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stat-mini .num { font-size: 22px; font-weight: 800; display: block; }
.stat-mini .lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
.num-ok { color: var(--success); }
.num-skip { color: #9ca3af; }

.reasons {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  max-height: 160px;
  overflow: auto;
  font-size: 12px;
  margin-bottom: 12px;
}

.reason {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 2px;
  border-bottom: 1px solid #f3f4f6;
}

.reason:last-child { border-bottom: none; }
.reason-count { font-weight: 700; color: var(--text-muted); }

.preview-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.toolbar {
  margin-bottom: 14px;
}

.search-wrap {
  position: relative;
}

.search-wrap i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
}

.search-wrap input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px 10px 34px;
  font-family: inherit;
  font-size: 13px;
}

.search-wrap input:focus {
  outline: 2px solid rgba(37,99,235,0.15);
  border-color: var(--accent);
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

@media (max-width: 700px) {
  .stats-row { grid-template-columns: repeat(3, 1fr); }
}

.stat-card {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
}

.stat-card .n { font-size: 18px; font-weight: 800; display: block; }
.stat-card .l { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

.card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  background: #fff;
}

.card.no-evade { border-left: 4px solid var(--warning); }
.card.overdue { border-left: 4px solid var(--danger); background: #fff5f5; }

.card-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}

.order-num {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.order-date {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 3px;
}

.cliente {
  font-size: 15px;
  font-weight: 700;
  margin-top: 6px;
}

.desc {
  font-size: 12px;
  color: var(--text-muted);
  font-style: italic;
  margin-top: 2px;
}

.desc.placeholder { opacity: 0.5; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.badge-alberto { background: #f3e8ff; color: #7c3aed; }
.badge-pietro { background: #e0f2fe; color: #0891b2; }
.badge-samuele { background: #d1fae5; color: #059669; }
.badge-salvo { background: #f1f5f9; color: #475569; }
.badge-smistare { background: #fef3c7; color: #b45309; }
.badge-other { background: #f3f4f6; color: #374151; }

.tag {
  display: inline-block;
  padding: 2px 7px;
  background: #f3f4f6;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  color: #4b5563;
}

.fields {
  margin-top: 12px;
  border-top: 1px solid #f3f4f6;
  padding-top: 12px;
  display: grid;
  gap: 8px;
}

.field {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px;
  align-items: start;
}

.field label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
  padding-top: 8px;
}

.field input,
.field textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
}

.field textarea { min-height: 40px; resize: vertical; }

.field input:focus,
.field textarea:focus {
  outline: 2px solid rgba(37,99,235,0.15);
  border-color: var(--accent);
}

.save-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  padding: 9px 12px;
  font-size: 12px;
}

.empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--text-muted);
}

.empty i {
  font-size: 40px;
  display: block;
  margin-bottom: 10px;
  opacity: 0.4;
}

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.45);
  z-index: 1000;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal-bg.active { display: flex; }

.modal {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 430px;
}

.modal h3 {
  font-size: 16px;
  margin-bottom: 10px;
}

.modal-body {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.modal-actions {
  display: grid;
  gap: 8px;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: #fff;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: opacity 0.3s ease;
}

.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="container">

  <div class="stale-banner">
    <i class="bi bi-exclamation-triangle-fill"></i> ATTENZIONE: DATI NON AGGIORNATI
    <small>Ultimo caricamento oltre 24 ore fa</small>
  </div>

  <div class="header">
    <div>
      <h1><i class="bi bi-list-check"></i> Ordini Grafica</h1>
      <div class="subtitle" id="lastUpdate">Caricamento...</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Aggiorna"><i class="bi bi-arrow-clockwise"></i></button>

</div>

<div class="modal-bg" id="modalBg">

    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalButtons"></div>
  </div>
</div>

<script>
"use strict";

const SUPABASE_URL = "https://emaiswhuznyqkzzzelvh.supabase.co";
const SUPABASE_KEY = "sb_publishable_7xF7dZXBDOahRmdanK-cFw_jx0sO0Cw";

const currentYear = new Date().getFullYear();

let supabase = null;
let allOrders = [];
let pendingImport = null;
let customMap = {};

const VALID_GRAFICI = new Set([
  "",
  "ALBERTO",
  "ALBERTO - COMPLETATO",
  "PIETRO",
  "PIETRO - COMPLETATO",
  "COMPLETATO",
  "SAMUELE",
  "SAMUELE - COMPLETATO"
]);

const $ = (id) => document.getElementById(id);
const tick = () => new Promise(resolve => setTimeout(resolve, 0));

function log(message, type = "info") {
  const panel = $("debugPanel");
  if (!panel) return;

  const time = new Date().toLocaleTimeString("it-IT", { hour12: false });
  const row = document.createElement("div");
  row.className = type;
  row.textContent = `[${time}] ${message}`;
  panel.appendChild(row);
  panel.scrollTop = panel.scrollHeight;
  console.log(`[${type.toUpperCase()}] ${message}`);
}

function toast(message, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  const icon = type === "error" ? "bi-x-circle-fill" : "bi-check-circle-fill";
  el.innerHTML = `<i class="bi ${icon}"></i> ${escapeHtml(message)}`;
  document.body.appendChild(el);

  setTimeout(() => {
    el.style.opacity = "0";
    setTimeout(() => el.remove(), 350);
  }, 2600);
}

function showLoading(title, status = "", percent = 0) {
  $("loadingBox").classList.add("active");
  $("loadingTitle").textContent = title;
  $("loadingStatus").textContent = status;
  $("progressFill").style.width = `${percent}%`;
}

function updateLoading(status, percent) {
  $("loadingStatus").textContent = status;
  $("progressFill").style.width = `${percent}%`;
}

function hideLoading() {
  $("loadingBox").classList.remove("active");
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function readFileAsArrayBuffer(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Lettura del file non riuscita"));
    reader.readAsArrayBuffer(file);
  });
}

async function decodeFile(file) {
  const buffer = await readFileAsArrayBuffer(file);

  let text;
  try {
    text = new TextDecoder("utf-8").decode(buffer);
  } catch (error) {
    text = new TextDecoder().decode(buffer);
  }

  const badUtf8 = (text.match(/\uFFFD/g) || []).length;

  if (badUtf8 > 0) {
    try {
      const alt = new TextDecoder("windows-1252").decode(buffer);
      const badAlt = (alt.match(/\uFFFD/g) || []).length;
      if (badAlt <= badUtf8) text = alt;
    } catch (error) {
      // tieni UTF-8
    }
  }

  return text.replace(/^\uFEFF/, "");
}

function parseCsv(text, delimiter) {
  const fields = [];
  let field = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (inQuotes && text[i + 1] === '"') {
        field += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
      continue;
    }

    if (!inQuotes && char === delimiter) {
      fields.push(field.trim());
      field = "";
      continue;
    }

    if (!inQuotes && (char === "\n" || char === "\r")) {
      if (char === "\r" && text[i + 1] === "\n") i++;
      fields.push(field.trim());
      field = "";
      continue;
    }

    if (inQuotes && (char === "\n" || char === "\r")) {
      field += " ";
      continue;
    }

    field += char;
  }

  fields.push(field.trim());
  return fields;
}

function parseItalianDate(value) {
  const s = String(value || "").trim();
  const match = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (!match) return null;

  const day = parseInt(match[1], 10);
  const month = parseInt(match[2], 10);
  let year = parseInt(match[3], 10);

  if (year < 100) year += 2000;
  if (month < 1 || month > 12) return null;

  const date = new Date(year, month - 1, day);
  if (isNaN(date.getTime())) return null;
  if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null;

  return date;
}

function isItalianDate(value) {
  return parseItalianDate(value) !== null;
}

function looksLikeStato(value) {
  const s = String(value || "").toLowerCase();
  return (
    s.includes("annullato") ||
    s.includes("confermato") ||
    s.includes("confermare") ||
    s.includes("concluso") ||
    s.includes("sospeso") ||
    s.includes("parz")
  );
}

function findOrderStarts(fields) {
  const starts = [];

  for (let i = 0; i + 3 < fields.length; i++) {
    if (!isItalianDate(fields[i])) continue;

    const numero = String(fields[i + 2] || "").trim();
    const stato = String(fields[i + 3] || "").trim();

    if (numero && looksLikeStato(stato)) {
      starts.push(i);
    }
  }

  return starts;
}

function parseDaneaCsv(text) {
  const delimiters = [",", ";", "\t"];
  let best = null;

  for (const delimiter of delimiters) {
    const fields = parseCsv(text, delimiter);
    const starts = findOrderStarts(fields);

    if (!best || starts.length > best.starts.length) {
      best = { fields, starts, delimiter };
    }
  }

  if (!best) {
    best = { fields: [], starts: [], delimiter: "," };
  }

  const records = [];

  for (let i = 0; i < best.starts.length; i++) {
    const start = best.starts[i];
    const end = i + 1 < best.starts.length ? best.starts[i + 1] : best.fields.length;
    const row = best.fields.slice(start, end);

    if (row.length < 7) continue;

    records.push({
      data: row[0] || "",
      operatore: row[1] || "",
      numero: row[2] || "",
      stato: row[3] || "",
      grafico: row[4] || "",
      dataEvasioneCsv: row[5] || "",
      cliente: row[6] || "",
      noteCsv: row[7] || "",
      prezzo: row[8] || "",
      settore: row[9] || ""
    });
  }

  return {
    fields: best.fields,
    starts: best.starts,
    records,
    delimiter: best.delimiter
  };
}

function normalizeGrafico(value) {
  return String(value || "")
    .toUpperCase()
    .replace(/\s+/g, " ")
    .trim();
}

function filterOrders(records) {
  const reasons = {};
  const validRaw = [];

  const addReason = (reason) => {
    reasons[reason] = (reasons[reason] || 0) + 1;
  };

  records.forEach((record) => {
    const date = parseItalianDate(record.data);
    if (!date) {
      addReason("Data non valida");
      return;
    }

    const stato = String(record.stato || "").toLowerCase();
    const grafico = normalizeGrafico(record.grafico);
    const numero = String(record.numero || "").toUpperCase().trim();
    const year = date.getFullYear();

    if (stato.includes("annullato")) {
      addReason("Annullato");
      return;
    }

    if (!(stato.includes("confermato") || stato.includes("confermare"))) {
      addReason(`Stato escluso: ${record.stato || "n/d"}`);
      return;
    }

    if (grafico === "SOSPESO" || stato.includes("sospeso")) {
      addReason("Sospeso");
      return;
    }

    if (numero.includes("/B")) {
      addReason("Numero /B");
      return;
    }

    if (!VALID_GRAFICI.has(grafico)) {
      addReason(`Grafico escluso: ${record.grafico || "n/d"}`);
      return;
    }

    if (year < currentYear - 1 || year > currentYear + 1) {
      addReason(`Anno escluso: ${year}`);
      return;
    }

    validRaw.push({
      numero_ordine: record.numero.trim(),
      anno_ordine: year,
      cliente: record.cliente.trim() || "Cliente",
      data_ordine: `${year}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`,
      grafico: record.grafico.trim(),
      stato: record.stato.trim(),
      settore: record.settore.trim()
    });
  });

  const unique = new Map();
  let duplicates = 0;

  validRaw.forEach((order) => {
    const key = `${order.numero_ordine}_${order.anno_ordine}`;
    if (unique.has(key)) duplicates++;
    unique.set(key, order);
  });

  if (duplicates > 0) reasons["Duplicati"] = duplicates;

  const valid = Array.from(unique.values());

  return {
    total: records.length,
    valid,
    validCount: valid.length,
    skipCount: records.length - valid.length,
    reasons
  };
}

async function handleFile(file) {
  try {
    log(`File selezionato: ${file.name} (${file.size} byte)`, "step");
    showLoading("Lettura file", "Carico il CSV...", 10);
    await tick();

    const text = await decodeFile(file);
    log(`File letto: ${text.length} caratteri`, "success");

    updateLoading("Analisi CSV...", 35);
    await tick();

    const parsed = parseDaneaCsv(text);

    log(`Delimitatore rilevato: "${parsed.delimiter}"`, "info");
    log(`Campi totali: ${parsed.fields.length}`, "info");
    log(`Inizi ordine trovati: ${parsed.starts.length}`, parsed.starts.length ? "success" : "error");

    if (parsed.starts.length === 0) {
      log("Primi 30 campi letti: " + parsed.fields.slice(0, 30).join(" | "), "warning");
    }

    updateLoading("Filtraggio ordini...", 65);
    await tick();

    const result = filterOrders(parsed.records);
    pendingImport = result;

    log(`Ordini riconosciuti: ${result.total}`, "info");
    log(`Ordini validi da importare: ${result.validCount}`, result.validCount ? "success" : "warning");
    log(`Ordini scartati: ${result.skipCount}`, result.skipCount ? "warning" : "info");

    showPreview(result);
    hideLoading();

    if (result.validCount === 0) {
      toast("Nessun ordine valido trovato", "error");
    } else {
      toast(`Trovati ${result.validCount} ordini validi`);
    }
  } catch (error) {
    hideLoading();
    log("ERRORE durante la lettura del CSV: " + error.message, "error");
    toast("Errore durante la lettura del CSV", "error");
  }
}

function showPreview(result) {
  $("preview").classList.add("active");

  $("previewStats").innerHTML = `
    <div class="stat-mini"><span class="num">${result.total}</span><span class="lbl">Letti</span></div>
    <div class="stat-mini"><span class="num num-ok">${result.validCount}</span><span class="lbl">Validi</span></div>
    <div class="stat-mini"><span class="num num-skip">${result.skipCount}</span><span class="lbl">Scartati</span></div>
  `;

  const reasons = Object.entries(result.reasons).sort((a, b) => b[1] - a[1]);

  if (reasons.length === 0) {
    $("previewReasons").innerHTML = `<div class="reason"><span>Nessuno scarto</span></div>`;
  } else {
    $("previewReasons").innerHTML = reasons
      .map(([reason, count]) => `<div class="reason"><span>${escapeHtml(reason)}</span><span class="reason-count">${count}</span></div>`)
      .join("");
  }

  $("importBtn").disabled = result.validCount === 0;
}

function cancelPreview() {
  pendingImport = null;
  $("preview").classList.remove("active");
  $("csvFile").value = "";
  log("Importazione annullata", "warning");
}

async function doImport() {
  if (!pendingImport || pendingImport.validCount === 0) return;

  if (!supabase) {
    toast("Supabase non disponibile", "error");
    return;
  }

  try {
    showLoading("Verifica dati esistenti", "Controllo se ci sono note o date salvate...", 10);
    log("Verifica dati esistenti su Supabase...", "step");

    const { data, error } = await supabase
      .from("ordini")
      .select("numero_ordine, anno_ordine, note_interne, descrizione_breve, data_evasione_grafica");

    if (error) throw error;

    customMap = {};

    (data || []).forEach((row) => {
      const hasCustom =
        (row.note_interne && row.note_interne.trim()) ||
        (row.descrizione_breve && row.descrizione_breve.trim()) ||
        row.data_evasione_grafica;

      if (hasCustom) {
        customMap[`${row.numero_ordine}_${row.anno_ordine}`] = {
          note_interne: row.note_interne || "",
          descrizione_breve: row.descrizione_breve || "",
          data_evasione_grafica: row.data_evasione_grafica
        };
      }
    });

    const hasAnyCustom = Object.keys(customMap).length > 0;
    log(`Ordini con dati personalizzati: ${Object.keys(customMap).length}`, "info");

    hideLoading();

    if (hasAnyCustom) {
      showModal(
        `<i class="bi bi-exclamation-triangle"></i> Dati salvati trovati`,
        `Ci sono <strong>${Object.keys(customMap).length}</strong> ordini con note, descrizioni o date evasione salvate.<br><br>
        Se scegli <strong>Mantieni</strong>, verranno conservate solo per gli ordini presenti anche nel nuovo CSV.<br>
        Se scegli <strong>Sovrascrivi</strong>, verrà cancellato tutto.`,
        [
          {
            label: `<i class="bi bi-shield-check"></i> Mantieni i dati salvati`,
            className: "btn-primary",
            onClick: () => runImport(true)
          },
          {
            label: `<i class="bi bi-arrow-repeat"></i> Sovrascrivi tutto`,
            className: "btn-danger",
            onClick: () => runImport(false)
          },
          {
            label: "Annulla",
            className: "btn-ghost",
            onClick: () => {}
          }
        ]
      );
    } else {
      await runImport(false);
    }
  } catch (error) {
    hideLoading();
    log("ERRORE verifica dati: " + error.message, "error");
    toast("Errore durante la verifica su Supabase", "error");
  }
}

async function runImport(keepCustomData) {
  try {
    showLoading("Importazione", "Cancellazione dati precedenti...", 10);
    log(`Importazione avviata (mantieni dati: ${keepCustomData})`, "step");

    const { error: deleteError } = await supabase
      .from("ordini")
      .delete()
      .gt("id", 0);

    if (deleteError) throw deleteError;

    log("Vecchi ordini cancellati", "success");

    const rows = pendingImport.valid;
    const batchSize = 100;
    let inserted = 0;

    for (let i = 0; i < rows.length; i += batchSize) {
      const batch = rows.slice(i, i + batchSize);

      const { error: insertError } = await supabase
        .from("ordini")
        .insert(batch);

      if (insertError) throw insertError;

      inserted += batch.length;
      const percent = 10 + Math.round((inserted / rows.length) * 70);
      updateLoading(`Inserimento ${inserted}/${rows.length} ordini...`, percent);
      log(`Batch inserito: ${batch.length} ordini`, "info");
      await tick();
    }

    if (keepCustomData && Object.keys(customMap).length > 0) {
      updateLoading("Ripristino dati salvati...", 85);
      log("Ripristino dati personalizzati...", "step");

      const { data: newRows, error: selectError } = await supabase
        .from("ordini")
        .select("id, numero_ordine, anno_ordine");

      if (!selectError && newRows) {
        let restored = 0;

        for (const row of newRows) {
          const saved = customMap[`${row.numero_ordine}_${row.anno_ordine}`];
          if (!saved) continue;

          const { error: updateError } = await supabase
            .from("ordini")
            .update(saved)
            .eq("id", row.id);

          if (!updateError) restored++;
        }

        log(`Dati personalizzati ripristinati: ${restored}`, "success");
      }
    }

    updateLoading("Aggiornamento timestamp...", 95);

    try {
      await supabase.from("meta").upsert({
        id: 1,
        ultima_importazione: new Date().toISOString()
      });
      log("Timestamp ultima importazione aggiornato", "success");
    } catch (metaError) {
      log("Impossibile aggiornare meta: " + metaError.message, "warning");
    }

    hideLoading();
    cancelPreview();
    toast(`Importati ${inserted} ordini`);
    await loadOrders();

  } catch (error) {
    hideLoading();
    log("ERRORE importazione: " + error.message, "error");
    toast("Errore importazione: " + error.message, "error");
  }
}

async function loadOrders() {
  try {
    $("ordersList").innerHTML = `
      <div class="empty">
        <i class="bi bi-hourglass-split"></i>
        Caricamento ordini...
      </div>
    `;

    if (!supabase) {
      $("ordersList").innerHTML = `
        <div class="empty">
          <i class="bi bi-wifi-off"></i>
          Supabase non disponibile.<br>
          <small>Il caricamento CSV funziona comunque, ma l’import no.</small>
        </div>
      `;
      return;
    }

    log("Caricamento ordini da Supabase...", "step");

    const { data, error } = await supabase
      .from("ordini")
      .select("*");

    if (error) throw error;

    allOrders = data || [];
    log(`Ordini caricati: ${allOrders.length}`, "success");

    renderOrders();
    await loadMeta();
  } catch (error) {
    log("ERRORE caricamento ordini: " + error.message, "error");

    $("ordersList").innerHTML = `
      <div class="empty">
        <i class="bi bi-database-x"></i>
        Errore database: ${escapeHtml(error.message)}<br><br>
        <small>Se la tabella non esiste, esegui lo SQL che ti ho dato.</small>
      </div>
    `;
  }
}

async function loadMeta() {
  try {
    if (!supabase) return;

    const { data, error } = await supabase
      .from("meta")
      .select("ultima_importazione")
      .eq("id", 1)
      .maybeSingle();

    const lastUpdate = $("lastUpdate");

    if (error) throw error;

    if (!data || !data.ultima_importazione) {
      lastUpdate.innerHTML = `<i class="bi bi-clock"></i> Nessun aggiornamento`;
      document.body.classList.remove("stale");
      return;
    }

    const last = new Date(data.ultima_importazione);
    const hours = (Date.now() - last.getTime()) / (1000 * 60 * 60);

    lastUpdate.innerHTML = `<i class="bi bi-clock"></i> Aggiornato: ${last.toLocaleString("it-IT")}`;

    if (hours > 24) {
      document.body.classList.add("stale");
      log(`Dati vecchi: ${hours.toFixed(1)} ore dall'ultima importazione`, "warning");
    } else {
      document.body.classList.remove("stale");
    }
  } catch (error) {
    log("Errore caricamento meta: " + error.message, "warning");
  }
}

function getGraficoInfo(raw) {
  const g = normalizeGrafico(raw);

  if (!g) return { label: "Da smistare", className: "badge-smistare", icon: "bi-person-plus" };
  if (g === "COMPLETATO") return { label: "Salvo G.", className: "badge-salvo", icon: "bi-person-check" };
  if (g.includes("ALBERTO")) return { label: "Alberto", className: "badge-alberto", icon: "bi-person" };
  if (g.includes("PIETRO")) return { label: "Pietro", className: "badge-pietro", icon: "bi-person" };
  if (g.includes("SAMUELE")) return { label: "Samuele", className: "badge-samuele", icon: "bi-person" };

  return { label: g, className: "badge-other", icon: "bi-person" };
}

function toDatetimeLocalValue(value) {
  if (!value) return "";

  const d = new Date(value);
  if (isNaN(d.getTime())) return "";

  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function renderOrders() {
  const search = $("searchInput").value.toLowerCase().trim();

  let visible = [...allOrders];

  if (search) {
    visible = visible.filter((o) =>
      String(o.cliente || "").toLowerCase().includes(search) ||
      String(o.numero_ordine || "").toLowerCase().includes(search) ||
      String(o.descrizione_breve || "").toLowerCase().includes(search) ||
      String(o.note_interne || "").toLowerCase().includes(search) ||
      String(o.settore || "").toLowerCase().includes(search)
    );
  }

  visible.sort((a, b) => {
    const aE = a.data_evasione_grafica ? new Date(a.data_evasione_grafica).getTime() : null;
    const bE = b.data_evasione_grafica ? new Date(b.data_evasione_grafica).getTime() : null;

    if (aE === null && bE !== null) return -1;
    if (aE !== null && bE === null) return 1;
    if (aE !== null && bE !== null && aE !== bE) return aE - bE;

    return new Date(b.data_ordine || 0) - new Date(a.data_ordine || 0);
  });

  const stats = {
    totale: visible.length,
    smistare: 0,
    alberto: 0,
    pietro: 0,
    samuele: 0,
    salvo: 0
  };

  visible.forEach((o) => {
    const g = normalizeGrafico(o.grafico);

    if (!g) stats.smistare++;
    else if (g.includes("ALBERTO")) stats.alberto++;
    else if (g.includes("PIETRO")) stats.pietro++;
    else if (g.includes("SAMUELE")) stats.samuele++;
    else if (g === "COMPLETATO") stats.salvo++;
  });

  $("statsRow").innerHTML = `
    <div class="stat-card"><span class="n">${stats.totale}</span><span class="l">Totale</span></div>
    <div class="stat-card"><span class="n" style="color:var(--warning)">${stats.smistare}</span><span class="l">Da smistare</span></div>
    <div class="stat-card"><span class="n" style="color:#7c3aed">${stats.alberto}</span><span class="l">Alberto</span></div>
    <div class="stat-card"><span class="n" style="color:#0891b2">${stats.pietro}</span><span class="l">Pietro</span></div>
    <div class="stat-card"><span class="n" style="color:#059669">${stats.samuele}</span><span class="l">Samuele</span></div>
    <div class="stat-card"><span class="n" style="color:#475569">${stats.salvo}</span><span class="l">Salvo G.</span></div>
  `;

  if (visible.length === 0) {
    $("ordersList").innerHTML = `
      <div class="empty">
        <i class="bi bi-inbox"></i>
        ${search ? "Nessun risultato" : "Nessun ordine"}<br>
        ${search ? "" : "<small>Carica il CSV per iniziare</small>"}
      </div>
    `;
    return;
  }

  $("ordersList").innerHTML = visible.map((o) => {
    const grafico = getGraficoInfo(o.grafico);
    const hasEvasione = !!o.data_evasione_grafica;
    const isOverdue = hasEvasione && new Date(o.data_evasione_grafica) < new Date();

    const cardClass = !hasEvasione ? "no-evade" : (isOverdue ? "overdue" : "");
    const evasioneValue = toDatetimeLocalValue(o.data_evasione_grafica);
    const dataOrdine = o.data_ordine ? new Date(o.data_ordine).toLocaleDateString("it-IT") : "";

    return `
      <div class="card ${cardClass}">
        <div class="card-top">
          <div>
            <div class="order-num">
              <i class="bi bi-hash"></i>
              ${escapeHtml(o.numero_ordine)}
              ${o.settore ? `<span class="tag">${escapeHtml(o.settore)}</span>` : ""}
            </div>
            <div class="order-date"><i class="bi bi-calendar3"></i> ${escapeHtml(dataOrdine)}</div>
            <div class="cliente">${escapeHtml(o.cliente || "Cliente n/d")}</div>
            ${
              o.descrizione_breve
                ? `<div class="desc">${escapeHtml(o.descrizione_breve)}</div>`
                : `<div class="desc placeholder">Nessuna descrizione breve</div>`
            }
          </div>

          <span class="badge ${grafico.className}">
            <i class="bi ${grafico.icon}"></i>
            ${escapeHtml(grafico.label)}
          </span>
        </div>

        <div class="fields">
          <div class="field">
            <label><i class="bi bi-clock-history"></i> Evasione</label>
            <input type="datetime-local" id="evade_${o.id}" value="${evasioneValue}">
          </div>

          <div class="field">
            <label><i class="bi bi-card-text"></i> Descrizione</label>
            <textarea id="desc_${o.id}">${escapeHtml(o.descrizione_breve || "")}</textarea>
          </div>

          <div class="field">
            <label><i class="bi bi-sticky"></i> Note interne</label>
            <textarea id="note_${o.id}">${escapeHtml(o.note_interne || "")}</textarea>
          </div>

          <button class="save-btn" data-save-id="${o.id}">
            <i class="bi bi-check-lg"></i> Salva modifiche
          </button>
        </div>
      </div>
    `;
  }).join("");
}

async function saveOrder(id) {
  const btn = document.querySelector(`[data-save-id="${id}"]`);
  if (btn) btn.disabled = true;

  try {
    if (!supabase) throw new Error("Supabase non disponibile");

    const evasione = $(`evade_${id}`).value;
    const descrizione = $(`desc_${id}`).value;
    const note = $(`note_${id}`).value;

    const payload = {
      descrizione_breve: descrizione,
      note_interne: note,
      data_evasione_grafica: evasione ? new Date(evasione).toISOString() : null
    };

    const { error } = await supabase
      .from("ordini")
      .update(payload)
      .eq("id", id);

    if (error) throw error;

    const local = allOrders.find((o) => String(o.id) === String(id));
    if (local) Object.assign(local, payload);

    toast("Ordine salvato");
    log(`Ordine ${id} salvato`, "success");
    renderOrders();
  } catch (error) {
    toast("Errore salvataggio: " + error.message, "error");
    log("ERRORE salvataggio ordine: " + error.message, "error");
  } finally {
    if (btn) btn.disabled = false;
  }
}

function confirmClearFirst() {
  showModal(
    `<i class="bi bi-exclamation-triangle"></i> Svuotare il database?`,
    "Questa è la <strong>prima conferma</strong>.<br>Tutti gli ordini verranno cancellati.",
    [
      {
        label: "Continua",
        className: "btn-danger",
        onClick: confirmClearSecond
      },
      {
        label: "Annulla",
        className: "btn-ghost",
        onClick: () => {}
      }
    ]
  );
}

function confirmClearSecond() {
  showModal(
    `<i class="bi bi-trash"></i> Seconda conferma`,
    "Sei davvero sicuro? L’operazione è irreversibile.",
    [
      {
        label: `<i class="bi bi-trash"></i> Sì, svuota tutto`,
        className: "btn-danger",
        onClick: doClear
      },
      {
        label: "Annulla",
        className: "btn-ghost",
        onClick: () => {}
      }
    ]
  );
}

async function doClear() {
  try {
    if (!supabase) throw new Error("Supabase non disponibile");

    log("Svuotamento database...", "step");

    const { error } = await supabase
      .from("ordini")
      .delete()
      .gt("id", 0);

    if (error) throw error;

    try {
      await supabase.from("meta").upsert({
        id: 1,
        ultima_importazione: new Date().toISOString()
      });
    } catch (e) {
      log("Errore aggiornamento meta dopo svuotamento: " + e.message, "warning");
    }

    allOrders = [];
    renderOrders();
    await loadMeta();

    toast("Database svuotato");
    log("Database svuotato", "success");
  } catch (error) {
    toast("Errore: " + error.message, "error");
    log("ERRORE svuotamento: " + error.message, "error");
  }
}

function showModal(title, bodyHtml, buttons) {
  $("modalTitle").innerHTML = title;
  $("modalBody").innerHTML = bodyHtml;

  const wrap = $("modalButtons");
  wrap.innerHTML = "";

  buttons.forEach((b) => {
    const btn = document.createElement("button");
    btn.className = b.className || "btn-ghost";
    btn.innerHTML = b.label;
    btn.addEventListener("click", () => {
      closeModal();
      if (b.onClick) b.onClick();
    });
    wrap.appendChild(btn);
  });

  $("modalBg").classList.add("active");
}

function closeModal() {
  $("modalBg").classList.remove("active");
}

function bindEvents() {
  $("logToggle").addEventListener("click", () => {
    $("debugPanel").classList.toggle("active");
  });

  $("refreshBtn").addEventListener("click", () => {
    log("Refresh manuale", "step");
    loadOrders();
  });

  $("clearBtn").addEventListener("click", confirmClearFirst);

  $("csvFile").addEventListener("change", function () {
    log("Input file cambiato", "info");
    if (this.files && this.files[0]) {
      handleFile(this.files[0]);
    }
    this.value = "";
  });

  const dz = $("dropzone");

  dz.addEventListener("click", () => {
    log("Click sulla dropzone", "info");
  });

  ["dragenter", "dragover"].forEach((eventName) => {
    dz.addEventListener(eventName, (e) => {
      e.preventDefault();
      dz.classList.add("dragover");
    });
  });

  ["dragleave", "drop"].forEach((eventName) => {
    dz.addEventListener(eventName, (e) => {
      e.preventDefault();
      dz.classList.remove("dragover");
    });
  });

  dz.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) handleFile(file);
  });

  $("cancelImportBtn").addEventListener("click", cancelPreview);
  $("importBtn").addEventListener("click", doImport);

  $("searchInput").addEventListener("input", renderOrders);

  $("ordersList").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-save-id]");
    if (btn) saveOrder(btn.getAttribute("data-save-id"));
  });

  $("modalBg").addEventListener("click", (e) => {
    if (e.target === $("modalBg")) closeModal();
  });
}

function init() {
  log("Avvio applicazione...", "step");
  log(`Anno corrente usato dai filtri: ${currentYear}`, "info");

  try {
    if (!window.supabase) {
      throw new Error("Libreria Supabase non caricata dal CDN");
    }

    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    log("Client Supabase creato", "success");
  } catch (error) {
    log("ERRORE init Supabase: " + error.message, "error");
  }

  bindEvents();
  loadOrders();

  setInterval(() => {
    loadMeta();
  }, 60000);
}

init();
</script>
