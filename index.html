<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ordini Grafica</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
// Intercetto errori anche prima del caricamento dello script principale
window.__bootErrors = [];

window.addEventListener("error", function (e) {
  window.__bootErrors.push("Errore JS: " + (e.message || "sconosciuto") + " (riga " + (e.lineno || "?") + ")");
});

window.addEventListener("unhandledrejection", function (e) {
  var msg = e && e.reason ? (e.reason.message || String(e.reason)) : "errore promise";
  window.__bootErrors.push("Errore async: " + msg);
});

// Questa funzione viene chiamata dall'input file nativo.
// Se lo script principale non è caricato, almeno te lo dice.
function __fileChanged(input) {
  var status = document.getElementById("fileStatus");
  var name = input && input.files && input.files[0] ? input.files[0].name : "nessun file";

  if (status) {
    status.textContent = "File selezionato: " + name;
  }

  if (typeof window.handleFileSelected === "function") {
    window.handleFileSelected(input.files[0]);
  } else {
    var log = document.getElementById("logBox");
    if (log) {
      var div = document.createElement("div");
      div.className = "log-error";
      div.textContent = "[ERRORE] Script principale non caricato.";
      log.appendChild(div);
    }
    alert("Script principale non caricato. Guarda il log nella pagina.");
  }
}
</script>

<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f8f9fa;
  --border: #e5e7eb;
  --text: #111827;
  --muted: #6b7280;
  --accent: #2563eb;
  --success: #059669;
  --danger: #dc2626;
  --warning: #d97706;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Inter", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 16px;
  padding-bottom: 80px;
}

body.stale { background: #fef2f2; }
body.stale .stale-banner { display: block; }

.container { max-width: 880px; margin: 0 auto; }

.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 14px;
}

h1 {
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.subtitle {
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}

.header-actions { display: flex; gap: 8px; }

.icon-btn {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.icon-btn.danger { color: var(--danger); }

.stale-banner {
  display: none;
  background: var(--danger);
  color: #fff;
  padding: 14px;
  border-radius: 10px;
  text-align: center;
  font-weight: 700;
  margin-bottom: 16px;
}

.stale-banner small {
  display: block;
  font-weight: 400;
  opacity: 0.9;
  margin-top: 4px;
}

.status-box {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1d4ed8;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
  margin-bottom: 12px;
}

.file-input-wrap {
  border: 1px solid var(--border);
  background: var(--bg-soft);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
}

.file-input-wrap input[type="file"] {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
}

.dropzone {
  border: 2px dashed #cbd5e1;
  background: #fff;
  border-radius: 12px;
  padding: 22px 14px;
  text-align: center;
  cursor: pointer;
  margin-bottom: 12px;
}

.dropzone.dragover {
  border-color: var(--accent);
  background: #eff6ff;
}

.log-box {
  background: #0f172a;
  color: #e2e8f0;
  border-radius: 10px;
  padding: 12px;
  font-family: monospace;
  font-size: 11px;
  max-height: 260px;
  overflow: auto;
  margin-bottom: 14px;
}

.log-info { color: #93c5fd; }
.log-success { color: #86efac; }
.log-warning { color: #fde047; }
.log-error { color: #fca5a5; }
.log-step { color: #c4b5fd; font-weight: 700; }

.loading {
  display: none;
  border: 1px solid #bfdbfe;
  background: #eff6ff;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
}

.loading.active { display: block; }

.loading-title {
  font-weight: 700;
  color: #1d4ed8;
  margin-bottom: 6px;
}

.loading-status {
  font-size: 13px;
  color: #2563eb;
  margin-bottom: 10px;
  min-height: 18px;
}

.progress {
  height: 8px;
  background: #dbeafe;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.2s ease;
}

button {
  font-family: inherit;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn-primary { background: var(--accent); color: #fff; padding: 10px 14px; }
.btn-success { background: var(--success); color: #fff; padding: 10px 14px; }
.btn-danger { background: var(--danger); color: #fff; padding: 10px 14px; }
.btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--text); padding: 10px 14px; }

.preview {
  display: none;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg-soft);
  padding: 14px;
  margin-bottom: 16px;
}

.preview.active { display: block; }

.preview h3 {
  font-size: 14px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.preview-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 10px;
}

.stat-mini {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stat-mini .num { font-size: 22px; font-weight: 800; display: block; }
.stat-mini .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; }
.num-ok { color: var(--success); }
.num-skip { color: #9ca3af; }

.reasons {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  max-height: 160px;
  overflow: auto;
  font-size: 12px;
  margin-bottom: 12px;
}

.reason {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 2px;
  border-bottom: 1px solid #f3f4f6;
}

.reason:last-child { border-bottom: none; }
.reason-count { font-weight: 700; color: var(--muted); }

.preview-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.toolbar { margin-bottom: 14px; }

.search-wrap { position: relative; }

.search-wrap i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #9ca3af;
}

.search-wrap input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px 10px 34px;
  font-family: inherit;
  font-size: 13px;
}

.search-wrap input:focus {
  outline: 2px solid rgba(37,99,235,0.15);
  border-color: var(--accent);
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}

@media (max-width: 700px) {
  .stats-row { grid-template-columns: repeat(3, 1fr); }
}

.stat-card {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
}

.stat-card .n { font-size: 18px; font-weight: 800; display: block; }
.stat-card .l { font-size: 10px; color: var(--muted); text-transform: uppercase; }

.card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  background: #fff;
}

.card.no-evade { border-left: 4px solid var(--warning); }
.card.overdue { border-left: 4px solid var(--danger); background: #fff5f5; }

.card-top {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}

.order-num {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.order-date {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

.cliente {
  font-size: 15px;
  font-weight: 700;
  margin-top: 6px;
}

.desc {
  font-size: 12px;
  color: var(--muted);
  font-style: italic;
  margin-top: 2px;
}

.desc.placeholder { opacity: 0.5; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}

.badge-alberto { background: #f3e8ff; color: #7c3aed; }
.badge-pietro { background: #e0f2fe; color: #0891b2; }
.badge-samuele { background: #d1fae5; color: #059669; }
.badge-salvo { background: #f1f5f9; color: #475569; }
.badge-smistare { background: #fef3c7; color: #b45309; }
.badge-other { background: #f3f4f6; color: #374151; }

.tag {
  display: inline-block;
  padding: 2px 7px;
  background: #f3f4f6;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  color: #4b5563;
}

.fields {
  margin-top: 12px;
  border-top: 1px solid #f3f4f6;
  padding-top: 12px;
  display: grid;
  gap: 8px;
}

.field {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 8px;
  align-items: start;
}

.field label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  padding-top: 8px;
}

.field input,
.field textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: inherit;
  font-size: 13px;
}

.field textarea { min-height: 40px; resize: vertical; }

.field input:focus,
.field textarea:focus {
  outline: 2px solid rgba(37,99,235,0.15);
  border-color: var(--accent);
}

.save-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  padding: 9px 12px;
  font-size: 12px;
}

.empty {
  text-align: center;
  padding: 40px 16px;
  color: var(--muted);
}

.empty i {
  font-size: 40px;
  display: block;
  margin-bottom: 10px;
  opacity: 0.4;
}

.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.45);
  z-index: 1000;
  padding: 20px;
  align-items: center;
  justify-content: center;
}

.modal-bg.active { display: flex; }

.modal {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  width: 100%;
  max-width: 430px;
}

.modal h3 { font-size: 16px; margin-bottom: 10px; }

.modal-body {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.modal-actions { display: grid; gap: 8px; }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #111827;
  color: #fff;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: opacity 0.3s ease;
}

.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
</style>
</head>
<body>

<div class="container">

  <div class="stale-banner">
    <i class="bi bi-exclamation-triangle-fill"></i> ATTENZIONE: DATI NON AGGIORNATI
    <small>Ultimo caricamento oltre 24 ore fa</small>
  </div>

  <div class="header">
    <div>
      <h1><i class="bi bi-list-check"></i> Ordini Grafica</h1>
      <div class="subtitle" id="lastUpdate">Caricamento...</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Aggiorna"><i class="bi bi-arrow-clockwise"></i></button>
      <button class="icon-btn danger" id="clearBtn" title="Svuota database"><i class="bi bi-trash"></i></button>
    </div>
  </div>

  <div class="status-box" id="fileStatus">In attesa di caricamento file...</div>

  <div class="file-input-wrap">
    <strong>Caricamento CSV</strong><br><br>
    <input type="file" id="csvFile" accept=".csv,.txt,text/csv" onchange="__fileChanged(this)">
  </div>

  <div class="dropzone" id="dropzone">
    <i class="bi bi-cloud-arrow-up" style="font-size:28px;color:#94a3b8;"></i>
    <div style="font-weight:700;margin-top:6px;">Trascina qui il CSV</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">oppure usa il campo qui sopra</div>
  </div>

  <div class="log-box" id="logBox"></div>

  <div class="loading" id="loadingBox">
    <div class="loading-title" id="loadingTitle">Elaborazione...</div>
    <div class="loading-status" id="loadingStatus"></div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="preview" id="preview">
    <h3><i class="bi bi-clipboard-data"></i> Anteprima filtraggio</h3>

    <div class="preview-stats" id="previewStats"></div>
    <div class="reasons" id="previewReasons"></div>

    <div class="preview-actions">
      <button class="btn-ghost" id="cancelImportBtn"><i class="bi bi-x-lg"></i> Annulla</button>
      <button class="btn-success" id="importBtn"><i class="bi bi-cloud-arrow-up"></i> Importa nel database</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Cerca cliente, numero ordine, note, descrizione...">
    </div>
  </div>

  <div class="stats-row" id="statsRow"></div>

  <div id="ordersList"></div>

</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalButtons"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://emaiswhuznyqkzzzelvh.supabase.co";
  var SUPABASE_KEY = "sb_publishable_7xF7dZXBDOahRmdanK-cFw_jx0sO0Cw";

  var currentYear = new Date().getFullYear();
  var allOrders = [];
  var pendingImport = null;
  var customMap = {};
  var supabaseClient = null;

  var VALID_GRAFICI = {
    "": true,
    "ALBERTO": true,
    "ALBERTO - COMPLETATO": true,
    "PIETRO": true,
    "PIETRO - COMPLETATO": true,
    "COMPLETATO": true,
    "SAMUELE": true,
    "SAMUELE - COMPLETATO": true
  };

  function $(id) {
    return document.getElementById(id);
  }

  function wait(ms) {
    return new Promise(function (resolve) {
      setTimeout(resolve, ms);
    });
  }

  function log(message, type) {
    var box = $("logBox");
    if (box) {
      var div = document.createElement("div");
      div.className = "log-" + (type || "info");
      div.textContent = "[" + new Date().toLocaleTimeString("it-IT", { hour12: false }) + "] " + message;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
    if (window.console) {
      console.log("[" + (type || "info").toUpperCase() + "] " + message);
    }
  }

  function setStatus(text) {
    var el = $("fileStatus");
    if (el) el.textContent = text;
  }

  function showLoading(title, status, percent) {
    $("loadingBox").classList.add("active");
    $("loadingTitle").textContent = title;
    $("loadingStatus").textContent = status || "";
    $("progressFill").style.width = (percent || 0) + "%";
  }

  function updateLoading(status, percent) {
    $("loadingStatus").textContent = status || "";
    $("progressFill").style.width = (percent || 0) + "%";
  }

  function hideLoading() {
    $("loadingBox").classList.remove("active");
  }

  function toast(message, type) {
    var el = document.createElement("div");
    el.className = "toast " + (type || "success");
    var icon = type === "error" ? "bi-x-circle-fill" : "bi-check-circle-fill";
    el.innerHTML = '<i class="bi ' + icon + '"></i> ' + escapeHtml(message);
    document.body.appendChild(el);

    setTimeout(function () {
      el.style.opacity = "0";
      setTimeout(function () {
        el.remove();
      }, 350);
    }, 2600);
  }

  function escapeHtml(value) {
    return String(value == null ? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // ==========================
  // SUPABASE caricato dynamic
  // ==========================
  function ensureSupabase() {
    return new Promise(function (resolve, reject) {
      if (supabaseClient) {
        resolve(supabaseClient);
        return;
      }

      function createClient() {
        try {
          if (!window.supabase) {
            reject(new Error("Oggetto window.supabase non disponibile"));
            return;
          }
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          log("Client Supabase creato", "success");
          resolve(supabaseClient);
        } catch (err) {
          reject(err);
        }
      }

      if (window.supabase) {
        createClient();
        return;
      }

      var script = document.createElement("script");
      script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      script.onload = createClient;
      script.onerror = function () {
        reject(new Error("Impossibile caricare la libreria Supabase dal CDN"));
      };
      document.head.appendChild(script);
    });
  }

  // ==========================
  // LETTURA FILE E DECODIFICA
  // ==========================
  function readBuffer(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        resolve(reader.result);
      };
      reader.onerror = function () {
        reject(new Error("Lettura del file non riuscita"));
      };
      reader.readAsArrayBuffer(file);
    });
  }

  function tryDecode(label, buffer) {
    try {
      return new TextDecoder(label).decode(buffer);
    } catch (err) {
      return null;
    }
  }

  function countDatePatterns(text) {
    var matches = text.match(/\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b/g);
    return matches ? matches.length : 0;
  }

  function decodeSmart(buffer) {
    var bytes = new Uint8Array(buffer);

    if (bytes.length >= 2) {
      if (bytes[0] === 0xFF && bytes[1] === 0xFE) {
        var utf16leBom = tryDecode("utf-16le", buffer);
        if (utf16leBom) return utf16leBom.replace(/^\uFEFF/, "");
      }

      if (bytes[0] === 0xFE && bytes[1] === 0xFF) {
        var utf16beBom = tryDecode("utf-16be", buffer);
        if (utf16beBom) return utf16beBom.replace(/^\uFEFF/, "");
      }
    }

    var utf8 = tryDecode("utf-8", buffer) || "";
    var best = utf8;
    var bestScore = countDatePatterns(utf8);

    var windows = tryDecode("windows-1252", buffer);
    if (windows) {
      var scoreWin = countDatePatterns(windows);
      if (scoreWin > bestScore) {
        best = windows;
        bestScore = scoreWin;
      }
    }

    var latin = tryDecode("iso-8859-1", buffer);
    if (latin) {
      var scoreLatin = countDatePatterns(latin);
      if (scoreLatin > bestScore) {
        best = latin;
        bestScore = scoreLatin;
      }
    }

    var utf16le = tryDecode("utf-16le", buffer);
    if (utf16le) {
      var scoreUtf16 = countDatePatterns(utf16le);
      if (scoreUtf16 > bestScore) {
        best = utf16le;
      }
    }

    return best.replace(/^\uFEFF/, "");
  }

  // ==========================
  // PARSER CSV
  // ==========================
  function detectDelimiter(text) {
    var counts = { ",": 0, ";": 0, "\t": 0 };
    var inQuotes = false;
    var limit = Math.min(text.length, 30000);

    for (var i = 0; i < limit; i++) {
      var c = text[i];

      if (c === '"') {
        inQuotes = !inQuotes;
      } else if (!inQuotes && (c === "," || c === ";" || c === "\t")) {
        counts[c]++;
      }
    }

    var best = ",";
    var max = -1;

    for (var key in counts) {
      if (counts[key] > max) {
        max = counts[key];
        best = key;
      }
    }

    return best;
  }

  function parseCsv(text, delimiter) {
    var fields = [];
    var field = "";
    var inQuotes = false;

    for (var i = 0; i < text.length; i++) {
      var c = text[i];

      if (c === '"') {
        if (inQuotes && text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (!inQuotes && c === delimiter) {
        fields.push(field.trim());
        field = "";
      } else if (!inQuotes && (c === "\n" || c === "\r")) {
        if (c === "\r" && text[i + 1] === "\n") i++;
        fields.push(field.trim());
        field = "";
      } else if (inQuotes && (c === "\n" || c === "\r")) {
        field += " ";
      } else {
        field += c;
      }
    }

    fields.push(field.trim());
    return fields;
  }

  function isItalianDate(value) {
    var s = String(value || "").trim();
    var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (!m) return false;

    var day = parseInt(m[1], 10);
    var month = parseInt(m[2], 10);
    var year = parseInt(m[3], 10);

    if (year < 100) year += 2000;
    if (month < 1 || month > 12) return false;
    if (day < 1 || day > 31) return false;

    var d = new Date(year, month - 1, day);
    return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
  }

  function parseItalianDate(value) {
    var s = String(value || "").trim();
    var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (!m) return null;

    var day = parseInt(m[1], 10);
    var month = parseInt(m[2], 10);
    var year = parseInt(m[3], 10);

    if (year < 100) year += 2000;

    var d = new Date(year, month - 1, day);
    if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;

    return d;
  }

  function looksLikeStato(value) {
    var s = String(value || "").toLowerCase();
    return (
      s.indexOf("annullato") >= 0 ||
      s.indexOf("confermato") >= 0 ||
      s.indexOf("confermare") >= 0 ||
      s.indexOf("concluso") >= 0 ||
      s.indexOf("sospeso") >= 0 ||
      s.indexOf("parz") >= 0
    );
  }

  function findStarts(fields) {
    var starts = [];

    for (var i = 0; i + 3 < fields.length; i++) {
      if (!isItalianDate(fields[i])) continue;

      var numero = String(fields[i + 2] || "").trim();
      var stato = String(fields[i + 3] || "").trim();

      if (numero && looksLikeStato(stato)) {
        starts.push(i);
      }
    }

    return starts;
  }

  function extractRecords(fields, starts) {
    var records = [];

    for (var i = 0; i < starts.length; i++) {
      var start = starts[i];
      var end = i + 1 < starts.length ? starts[i + 1] : fields.length;
      var row = fields.slice(start, end);

      if (row.length < 7) continue;

      records.push({
        data: row[0] || "",
        operatore: row[1] || "",
        numero: row[2] || "",
        stato: row[3] || "",
        grafico: row[4] || "",
        dataEvasioneCsv: row[5] || "",
        cliente: row[6] || "",
        noteCsv: row[7] || "",
        prezzo: row[8] || "",
        settore: row[9] || ""
      });
    }

    return records;
  }

  function parseAny(text) {
    var detected = detectDelimiter(text);
    var delimiters = [detected];

    if (detected !== ",") delimiters.push(",");
    if (detected !== ";") delimiters.push(";");
    if (detected !== "\t") delimiters.push("\t");

    var best = null;

    for (var i = 0; i < delimiters.length; i++) {
      var d = delimiters[i];
      var fields = parseCsv(text, d);
      var starts = findStarts(fields);

      log('Delimitatore "' + (d === "\t" ? "TAB" : d) + '": campi ' + fields.length + ", inizi ordine " + starts.length, "info");

      if (!best || starts.length > best.starts.length) {
        best = {
          delimiter: d,
          fields: fields,
          starts: starts
        };
      }

      if (starts.length > 0 && d === detected) {
        break;
      }
    }

    if (!best) {
      return { fields: [], starts: [], records: [], delimiter: detected };
    }

    best.records = extractRecords(best.fields, best.starts);
    return best;
  }

  // ==========================
  // FILTRI
  // ==========================
  function normalizeGrafico(value) {
    return String(value || "")
      .toUpperCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  function filterOrders(records) {
    var reasons = {};
    var validRaw = [];

    function skip(reason) {
      reasons[reason] = (reasons[reason] || 0) + 1;
    }

    records.forEach(function (rec) {
      var date = parseItalianDate(rec.data);
      if (!date) {
        skip("Data non valida");
        return;
      }

      var stato = String(rec.stato || "").toLowerCase();
      var grafico = normalizeGrafico(rec.grafico);
      var numero = String(rec.numero || "").toUpperCase().trim();
      var year = date.getFullYear();

      if (stato.indexOf("annullato") >= 0) {
        skip("Annullato");
        return;
      }

      if (!(stato.indexOf("confermato") >= 0 || stato.indexOf("confermare") >= 0)) {
        skip("Stato escluso: " + (rec.stato || "n/d"));
        return;
      }

      if (grafico === "SOSPESO" || stato.indexOf("sospeso") >= 0) {
        skip("Sospeso");
        return;
      }

      if (numero.indexOf("/B") >= 0) {
        skip("Numero /B");
        return;
      }

      if (!VALID_GRAFICI[grafico]) {
        skip("Grafico escluso: " + (rec.grafico || "n/d"));
        return;
      }

      if (year < currentYear - 1 || year > currentYear + 1) {
        skip("Anno escluso: " + year);
        return;
      }

      validRaw.push({
        numero_ordine: rec.numero.trim(),
        anno_ordine: year,
        cliente: rec.cliente.trim() || "Cliente",
        data_ordine: year + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0"),
        grafico: rec.grafico.trim(),
        stato: rec.stato.trim(),
        settore: rec.settore.trim()
      });
    });

    var unique = new Map();
    var duplicates = 0;

    validRaw.forEach(function (order) {
      var key = order.numero_ordine + "_" + order.anno_ordine;
      if (unique.has(key)) duplicates++;
      unique.set(key, order);
    });

    if (duplicates > 0) reasons["Duplicati"] = duplicates;

    var valid = Array.from(unique.values());

    return {
      total: records.length,
      valid: valid,
      validCount: valid.length,
      skipCount: records.length - valid.length,
      reasons: reasons
    };
  }

  // ==========================
  // GESTIONE FILE
  // ==========================
  async function handleFileSelected(file) {
    if (!file) {
      setStatus("Nessun file selezionato");
      return;
    }

    log("File selezionato: " + file.name + " (" + file.size + " byte)", "step");
    setStatus("Lettura file: " + file.name);
    showLoading("Lettura file", "Carico il CSV...", 10);

    try {
      var buffer = await readBuffer(file);
      log("File letto in memoria", "success");

      updateLoading("Decodifica testo...", 25);
      await wait(20);

      var text = decodeSmart(buffer);
      log("Testo decodificato: " + text.length + " caratteri", "info");

      updateLoading("Analisi CSV...", 45);
      await wait(20);

      var parsed = parseAny(text);
      log("Ordini riconosciuti: " + parsed.starts.length, parsed.starts.length ? "success" : "error");

      if (parsed.starts.length === 0) {
        log("Primi 50 campi letti: " + parsed.fields.slice(0, 50).join(" | "), "warning");
      }

      updateLoading("Filtraggio ordini...", 70);
      await wait(20);

      var result = filterOrders(parsed.records);
      pendingImport = result;

      showPreview(result);
      hideLoading();

      setStatus("CSV analizzato: " + result.validCount + " ordini validi");

      if (result.validCount === 0) {
        toast("Nessun ordine valido trovato", "error");
      } else {
        toast("Trovati " + result.validCount + " ordini validi");
      }
    } catch (err) {
      hideLoading();
      log("ERRORE durante la gestione del file: " + err.message, "error");
      setStatus("Errore: " + err.message);
      toast("Errore durante la gestione del file", "error");
    }
  }

  window.handleFileSelected = handleFileSelected;

  function showPreview(result) {
    $("preview").classList.add("active");

    $("previewStats").innerHTML =
      '<div class="stat-mini"><span class="num">' + result.total + '</span><span class="lbl">Letti</span></div>' +
      '<div class="stat-mini"><span class="num num-ok">' + result.validCount + '</span><span class="lbl">Validi</span></div>' +
      '<div class="stat-mini"><span class="num num-skip">' + result.skipCount + '</span><span class="lbl">Scartati</span></div>';

    var reasons = Object.entries(result.reasons).sort(function (a, b) {
      return b[1] - a[1];
    });

    if (reasons.length === 0) {
      $("previewReasons").innerHTML = '<div class="reason"><span>Nessuno scarto</span></div>';
    } else {
      $("previewReasons").innerHTML = reasons.map(function (item) {
        return '<div class="reason"><span>' + escapeHtml(item[0]) + '</span><span class="reason-count">' + item[1] + "</span></div>";
      }).join("");
    }

    $("importBtn").disabled = result.validCount === 0;
  }

  function cancelPreview() {
    pendingImport = null;
    $("preview").classList.remove("active");
    $("csvFile").value = "";
    setStatus("Importazione annullata");
    log("Importazione annullata", "warning");
  }

  // ==========================
  // IMPORT
  // ==========================
  async function doImport() {
    if (!pendingImport || pendingImport.validCount === 0) return;

    try {
      showLoading("Verifica dati esistenti", "Controllo se ci sono note o date salvate...", 10);
      log("Verifica dati esistenti su Supabase...", "step");

      var client = await ensureSupabase();

      var existingRes = await client
        .from("ordini")
        .select("numero_ordine, anno_ordine, note_interne, descrizione_breve, data_evasione_grafica");

      if (existingRes.error) throw existingRes.error;

      customMap = {};

      (existingRes.data || []).forEach(function (row) {
        var hasCustom =
          (row.note_interne && row.note_interne.trim()) ||
          (row.descrizione_breve && row.descrizione_breve.trim()) ||
          row.data_evasione_grafica;

        if (hasCustom) {
          customMap[row.numero_ordine + "_" + row.anno_ordine] = {
            note_interne: row.note_interne || "",
            descrizione_breve: row.descrizione_breve || "",
            data_evasione_grafica: row.data_evasione_grafica
          };
        }
      });

      var hasAnyCustom = Object.keys(customMap).length > 0;
      log("Ordini con dati personalizzati: " + Object.keys(customMap).length, "info");

      hideLoading();

      if (hasAnyCustom) {
        showModal(
          '<i class="bi bi-exclamation-triangle"></i> Dati salvati trovati',
          "Ci sono <strong>" + Object.keys(customMap).length + "</strong> ordini con note, descrizioni o date evasione salvate.<br><br>" +
          "Se scegli <strong>Mantieni</strong>, verranno conservate solo per gli ordini presenti anche nel nuovo CSV.<br>" +
          "Se scegli <strong>Sovrascrivi</strong>, verrà cancellato tutto.",
          [
            {
              label: '<i class="bi bi-shield-check"></i> Mantieni i dati salvati',
              className: "btn-primary",
              onClick: function () {
                runImport(true);
              }
            },
            {
              label: '<i class="bi bi-arrow-repeat"></i> Sovrascrivi tutto',
              className: "btn-danger",
              onClick: function () {
                runImport(false);
              }
            },
            {
              label: "Annulla",
              className: "btn-ghost",
              onClick: function () {}
            }
          ]
        );
      } else {
        await runImport(false);
      }
    } catch (err) {
      hideLoading();
      log("ERRORE verifica dati: " + err.message, "error");
      toast("Errore durante la verifica su Supabase", "error");
    }
  }

  async function runImport(keepCustomData) {
    try {
      showLoading("Importazione", "Cancellazione dati precedenti...", 10);
      log("Importazione avviata (mantieni dati: " + keepCustomData + ")", "step");

      var client = await ensureSupabase();

      var deleteRes = await client.from("ordini").delete().gt("id", 0);
      if (deleteRes.error) throw deleteRes.error;

      log("Vecchi ordini cancellati", "success");

      var rows = pendingImport.valid;
      var batchSize = 100;
      var inserted = 0;

      for (var i = 0; i < rows.length; i += batchSize) {
        var batch = rows.slice(i, i + batchSize);

        var insertRes = await client.from("ordini").insert(batch);
        if (insertRes.error) throw insertRes.error;

        inserted += batch.length;
        var percent = 10 + Math.round((inserted / rows.length) * 70);
        updateLoading("Inserimento " + inserted + "/" + rows.length + " ordini...", percent);
        log("Batch inserito: " + batch.length + " ordini", "info");
        await wait(10);
      }

      if (keepCustomData && Object.keys(customMap).length > 0) {
        updateLoading("Ripristino dati salvati...", 85);
        log("Ripristino dati personalizzati...", "step");

        var newRowsRes = await client.from("ordini").select("id, numero_ordine, anno_ordine");
        if (!newRowsRes.error && newRowsRes.data) {
          var restored = 0;

          for (var j = 0; j < newRowsRes.data.length; j++) {
            var row = newRowsRes.data[j];
            var saved = customMap[row.numero_ordine + "_" + row.anno_ordine];
            if (!saved) continue;

            var updateRes = await client.from("ordini").update(saved).eq("id", row.id);
            if (!updateRes.error) restored++;
          }

          log("Dati personalizzati ripristinati: " + restored, "success");
        }
      }

      updateLoading("Aggiornamento timestamp...", 95);

      try {
        await client.from("meta").upsert({ id: 1, ultima_importazione: new Date().toISOString() }, { onConflict: "id" });
        log("Timestamp ultima importazione aggiornato", "success");
      } catch (metaErr) {
        log("Impossibile aggiornare meta: " + metaErr.message, "warning");
      }

      hideLoading();
      cancelPreview();
      toast("Importati " + inserted + " ordini");
      await loadOrders();
    } catch (err) {
      hideLoading();
      log("ERRORE importazione: " + err.message, "error");
      toast("Errore importazione: " + err.message, "error");
    }
  }

  async function loadOrders() {
    try {
      $("ordersList").innerHTML = '<div class="empty"><i class="bi bi-hourglass-split"></i>Caricamento ordini...</div>';
      setStatus("Caricamento ordini da Supabase...");
      log("Caricamento ordini da Supabase...", "step");

      var client = await ensureSupabase();
      var res = await client.from("ordini").select("*");

      if (res.error) throw res.error;

      allOrders = res.data || [];
      log("Ordini caricati: " + allOrders.length, "success");
      setStatus("Ordini caricati: " + allOrders.length);

      renderOrders();
      await loadMeta();
    } catch (err) {
      log("ERRORE caricamento ordini: " + err.message, "error");
      setStatus("Errore Supabase: " + err.message);

      $("ordersList").innerHTML =
        '<div class="empty"><i class="bi bi-database-x"></i>Errore database: ' +
        escapeHtml(err.message) +
        "<br><br><small>Se la tabella non esiste, esegui lo SQL di creazione.</small></div>";
    }
  }

  async function loadMeta() {
    try {
      var client = await ensureSupabase();

      var res = await client
        .from("meta")
        .select("ultima_importazione")
        .eq("id", 1)
        .maybeSingle();

      var lastUpdate = $("lastUpdate");

      if (res.error) throw res.error;

      if (!res.data || !res.data.ultima_importazione) {
        lastUpdate.innerHTML = '<i class="bi bi-clock"></i> Nessun aggiornamento';
        document.body.classList.remove("stale");
        return;
      }

      var last = new Date(res.data.ultima_importazione);
      var hours = (Date.now() - last.getTime()) / (1000 * 60 * 60);

      lastUpdate.innerHTML = '<i class="bi bi-clock"></i> Aggiornato: ' + last.toLocaleString("it-IT");

      if (hours > 24) {
        document.body.classList.add("stale");
        log("Dati vecchi: " + hours.toFixed(1) + " ore dall'ultima importazione", "warning");
      } else {
        document.body.classList.remove("stale");
      }
    } catch (err) {
      log("Errore caricamento meta: " + err.message, "warning");
    }
  }

  function getGraficoInfo(raw) {
    var g = normalizeGrafico(raw);

    if (!g) return { label: "Da smistare", className: "badge-smistare", icon: "bi-person-plus" };
    if (g === "COMPLETATO") return { label: "Salvo G.", className: "badge-salvo", icon: "bi-person-check" };
    if (g.indexOf("ALBERTO") >= 0) return { label: "Alberto", className: "badge-alberto", icon: "bi-person" };
    if (g.indexOf("PIETRO") >= 0) return { label: "Pietro", className: "badge-pietro", icon: "bi-person" };
    if (g.indexOf("SAMUELE") >= 0) return { label: "Samuele", className: "badge-samuele", icon: "bi-person" };

    return { label: g, className: "badge-other", icon: "bi-person" };
  }

  function toDatetimeLocalValue(value) {
    if (!value) return "";

    var d = new Date(value);
    if (isNaN(d.getTime())) return "";

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderOrders() {
    var search = $("searchInput") ? $("searchInput").value.toLowerCase().trim() : "";

    var visible = allOrders.slice();

    if (search) {
      visible = visible.filter(function (o) {
        return (
          String(o.cliente || "").toLowerCase().indexOf(search) >= 0 ||
          String(o.numero_ordine || "").toLowerCase().indexOf(search) >= 0 ||
          String(o.descrizione_breve || "").toLowerCase().indexOf(search) >= 0 ||
          String(o.note_interne || "").toLowerCase().indexOf(search) >= 0 ||
          String(o.settore || "").toLowerCase().indexOf(search) >= 0
        );
      });
    }

    visible.sort(function (a, b) {
      var aE = a.data_evasione_grafica ? new Date(a.data_evasione_grafica).getTime() : null;
      var bE = b.data_evasione_grafica ? new Date(b.data_evasione_grafica).getTime() : null;

      if (aE === null && bE !== null) return -1;
      if (aE !== null && bE === null) return 1;
      if (aE !== null && bE !== null && aE !== bE) return aE - bE;

      return new Date(b.data_ordine || 0) - new Date(a.data_ordine || 0);
    });

    var stats = {
      totale: visible.length,
      smistare: 0,
      alberto: 0,
      pietro: 0,
      samuele: 0,
      salvo: 0
    };

    visible.forEach(function (o) {
      var g = normalizeGrafico(o.grafico);

      if (!g) stats.smistare++;
      else if (g.indexOf("ALBERTO") >= 0) stats.alberto++;
      else if (g.indexOf("PIETRO") >= 0) stats.pietro++;
      else if (g.indexOf("SAMUELE") >= 0) stats.samuele++;
      else if (g === "COMPLETATO") stats.salvo++;
    });

    $("statsRow").innerHTML =
      '<div class="stat-card"><span class="n">' + stats.totale + '</span><span class="l">Totale</span></div>' +
      '<div class="stat-card"><span class="n" style="color:var(--warning)">' + stats.smistare + '</span><span class="l">Da smistare</span></div>' +
      '<div class="stat-card"><span class="n" style="color:#7c3aed">' + stats.alberto + '</span><span class="l">Alberto</span></div>' +
      '<div class="stat-card"><span class="n" style="color:#0891b2">' + stats.pietro + '</span><span class="l">Pietro</span></div>' +
      '<div class="stat-card"><span class="n" style="color:#059669">' + stats.samuele + '</span><span class="l">Samuele</span></div>' +
      '<div class="stat-card"><span class="n" style="color:#475569">' + stats.salvo + '</span><span class="l">Salvo G.</span></div>';

    if (visible.length === 0) {
      $("ordersList").innerHTML =
        '<div class="empty"><i class="bi bi-inbox"></i>' +
        (search ? "Nessun risultato" : "Nessun ordine") +
        "<br>" +
        (search ? "" : "<small>Carica il CSV per iniziare</small>") +
        "</div>";
      return;
    }

    $("ordersList").innerHTML = visible.map(function (o) {
      var grafico = getGraficoInfo(o.grafico);
      var hasEvasione = !!o.data_evasione_grafica;
      var isOverdue = hasEvasione && new Date(o.data_evasione_grafica) < new Date();

      var cardClass = !hasEvasione ? "no-evade" : (isOverdue ? "overdue" : "");
      var evasioneValue = toDatetimeLocalValue(o.data_evasione_grafica);
      var dataOrdine = o.data_ordine ? new Date(o.data_ordine).toLocaleDateString("it-IT") : "";

      return (
        '<div class="card ' + cardClass + '">' +
          '<div class="card-top">' +
            "<div>" +
              '<div class="order-num">' +
                '<i class="bi bi-hash"></i>' +
                escapeHtml(o.numero_ordine) +
                (o.settore ? '<span class="tag">' + escapeHtml(o.settore) + "</span>" : "") +
              "</div>" +
              '<div class="order-date"><i class="bi bi-calendar3"></i> ' + escapeHtml(dataOrdine) + "</div>" +
              '<div class="cliente">' + escapeHtml(o.cliente || "Cliente n/d") + "</div>" +
              (
                o.descrizione_breve
                  ? '<div class="desc">' + escapeHtml(o.descrizione_breve) + "</div>"
                  : '<div class="desc placeholder">Nessuna descrizione breve</div>'
              ) +
            "</div>" +
            '<span class="badge ' + grafico.className + '"><i class="bi ' + grafico.icon + '"></i>' + escapeHtml(grafico.label) + "</span>" +
          "</div>" +
          '<div class="fields">' +
            '<div class="field">' +
              '<label><i class="bi bi-clock-history"></i> Evasione</label>' +
              '<input type="datetime-local" id="evade_' + o.id + '" value="' + evasioneValue + '">' +
            "</div>" +
            '<div class="field">' +
              '<label><i class="bi bi-card-text"></i> Descrizione</label>' +
              '<textarea id="desc_' + o.id + '">' + escapeHtml(o.descrizione_breve || "") + "</textarea>" +
            "</div>" +
            '<div class="field">' +
              '<label><i class="bi bi-sticky"></i> Note interne</label>' +
              '<textarea id="note_' + o.id + '">' + escapeHtml(o.note_interne || "") + "</textarea>" +
            "</div>" +
            '<button class="save-btn" data-save-id="' + o.id + '"><i class="bi bi-check-lg"></i> Salva modifiche</button>' +
          "</div>" +
        "</div>"
      );
    }).join("");
  }

  async function saveOrder(id) {
    var btn = document.querySelector('[data-save-id="' + id + '"]');
    if (btn) btn.disabled = true;

    try {
      var client = await ensureSupabase();

      var evasione = $("evade_" + id).value;
      var descrizione = $("desc_" + id).value;
      var note = $("note_" + id).value;

      var payload = {
        descrizione_breve: descrizione,
        note_interne: note,
        data_evasione_grafica: evasione ? new Date(evasione).toISOString() : null
      };

      var res = await client.from("ordini").update(payload).eq("id", id);
      if (res.error) throw res.error;

      var local = allOrders.find(function (o) {
        return String(o.id) === String(id);
      });

      if (local) {
        local.descrizione_breve = descrizione;
        local.note_interne = note;
        local.data_evasione_grafica = payload.data_evasione_grafica;
      }

      toast("Ordine salvato");
      log("Ordine " + id + " salvato", "success");
      renderOrders();
    } catch (err) {
      toast("Errore salvataggio: " + err.message, "error");
      log("ERRORE salvataggio ordine: " + err.message, "error");
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  async function doClear() {
    if (!confirm("Prima conferma: vuoi davvero svuotare il database?")) return;
    if (!confirm("Seconda conferma: tutti gli ordini verranno cancellati. Procedo?")) return;

    try {
      var client = await ensureSupabase();

      var res = await client.from("ordini").delete().gt("id", 0);
      if (res.error) throw res.error;

      try {
        await client.from("meta").upsert({ id: 1, ultima_importazione: new Date().toISOString() }, { onConflict: "id" });
      } catch (metaErr) {
        log("Errore aggiornamento meta dopo svuotamento: " + metaErr.message, "warning");
      }

      allOrders = [];
      renderOrders();
      await loadMeta();

      toast("Database svuotato");
      log("Database svuotato", "success");
    } catch (err) {
      toast("Errore: " + err.message, "error");
      log("ERRORE svuotamento: " + err.message, "error");
    }
  }

  // ==========================
  // MODAL
  // ==========================
  function showModal(title, bodyHtml, buttons) {
    $("modalTitle").innerHTML = title;
    $("modalBody").innerHTML = bodyHtml;

    var wrap = $("modalButtons");
    wrap.innerHTML = "";

    buttons.forEach(function (b) {
      var btn = document.createElement("button");
      btn.className = b.className || "btn-ghost";
      btn.innerHTML = b.label;
      btn.addEventListener("click", function () {
        closeModal();
        if (b.onClick) b.onClick();
      });
      wrap.appendChild(btn);
    });

    $("modalBg").classList.add("active");
  }

  function closeModal() {
    $("modalBg").classList.remove("active");
  }

  // ==========================
  // UI BINDING
  // ==========================
  function bindUi() {
    $("refreshBtn").addEventListener("click", function () {
      log("Refresh manuale", "step");
      loadOrders();
    });

    $("clearBtn").addEventListener("click", function () {
      doClear();
    });

    $("cancelImportBtn").addEventListener("click", function () {
      cancelPreview();
    });

    $("importBtn").addEventListener("click", function () {
      doImport();
    });

    $("searchInput").addEventListener("input", function () {
      renderOrders();
    });

    $("ordersList").addEventListener("click", function (e) {
      var btn = e.target && e.target.closest ? e.target.closest("[data-save-id]") : null;
      if (btn) saveOrder(btn.getAttribute("data-save-id"));
    });

    $("modalBg").addEventListener("click", function (e) {
      if (e.target === $("modalBg")) closeModal();
    });

    var dz = $("dropzone");

    dz.addEventListener("click", function () {
      $("csvFile").click();
    });

    ["dragenter", "dragover"].forEach(function (eventName) {
      dz.addEventListener(eventName, function (e) {
        e.preventDefault();
        dz.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(function (eventName) {
      dz.addEventListener(eventName, function (e) {
        e.preventDefault();
        dz.classList.remove("dragover");
      });
    });

    dz.addEventListener("drop", function (e) {
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleFileSelected(file);
    });
  }

  function init() {
    log("Inizializzazione dashboard...", "step");
    log("Anno corrente usato dai filtri: " + currentYear, "info");

    (window.__bootErrors || []).forEach(function (err) {
      log(err, "error");
    });

    if ((window.__bootErrors || []).length === 0) {
      log("Pagina caricata. Script principale attivo.", "success");
    }

    bindUi();
    loadOrders();

    setInterval(function () {
      if (supabaseClient) loadMeta();
    }, 60000);
  }

  init();
})();
</script>

</body>
</html>
